autobuilder:
  diff:
    exclude-folders:
      - logs
      - test
      - responses
      - target
    exclude-files:
      - meta.json
  evaluation:
    heuristic-threshold: 0.4
    max-score-drop: 0.2
    min-changed-files: 2
    fileContentMaxLines: 150
  evolution:
    # T4-BL (lighter fix): rewrite a fragmenting write to the package its type already lives in
    # (path + package declaration + same-mutation cross-references) instead of letting the
    # T4-BH gate reject it at probe time. The gate stays as backstop for the skipped cases.
    # Code default is false; enabled here so real runs validate it (same pattern as
    # build.classifier.adaptive).
    package-consolidation:
      enabled: true
  goal:
    migrate-to-graph: false
    sync-from-graph: true
    # T2-EG: completion-edge coverage gate (leading "is this gap already implemented?" question over
    # a flat blob — false-positived 18/18 on the 2026-06-16 hollow artifact). Off by default; T4-BP-3's
    # inverse per-criterion corroboration is the single home for "is the work done?". Flip to true to
    # re-arm the incumbent if T4-BP-3 underperforms in the field.
    completion-coverage-gate-enabled: false
    max-consecutive-subgoal-exhaustions: 5
    min-exhausted-children-floor: 5
    # T4-AJ Part B: catch-up consolidation of equivalent goals (shared reviewer).
    consolidation:
      enabled: true
      stagnation-streak: 3
      active-leaf-threshold: 10
      max-reviewer-calls: 5
      similarity-floor: 0.5
      # T2-EC grace window is derived, not configured: leaf count alone only triggers after a
      # merge landed or one observed cycle per active leaf passed (scales with tree size).
  service:
    reset-on-start: true
  heuristic:
    score-strategy: weightedAverageScoreAdjustmentStrategy
  criteria:
    graduation-ratio: 0.80
    graduation-min-fail-streak: 3
  parser:
    source-root: src/main/java
  # Offline neural TTS via Piper (rhasspy). Binary + voice model auto-download to
  # cache-dir on first start; subsequent runs use the cached copies. Frontend applies
  # reverb/delay on top via Web Audio API.
  tts:
    cache-dir: ${user.home}/.cache/autobuilder-piper
    voice: en_US-amy-medium
    piper-version: 2023.11.14-2
    voice-base-url: https://huggingface.co/rhasspy/piper-voices/resolve/main
    piper-base-url: https://github.com/rhasspy/piper/releases/download
  bootstrap:
    enabled: false
    # T3-BT: "auto" = copy bootstrap/build/ into output/ if present (explicit skeleton path);
    # "none" = disable seeding entirely (LLM-detected fallback requires T4-AN-5, not yet wired)
    build-system: auto
  scheduler:
    enabled: false
  # T4-AN-1: post-merge compile gate. When enabled, MergeAgent runs the configured build
  # command after every successful merge and stores the outcome on CycleContextData.
  # BuildResultHeuristic turns COMPILE_ERROR into a CRITICAL REJECTED opinion that overrides
  # every other heuristic. Off by default — target projects without a Maven setup should
  # leave this disabled.
  build:
    enabled: true
    # T4-BN-2: `test-compile` (not `compile`) so the per-cycle probe also compiles src/test/java —
    # a broken test (cannot find symbol) then steers evolution in-cycle instead of only surfacing at
    # the completion edge's package gate (the 2026-06-17 root GIVEN_UP). Set back to `mvn compile`
    # for main-only probing.
    command: mvn test-compile
    timeout-ms: 120000
    working-dir: ${FILE_BASE_PATH:/data/firestarter}/output
    # T4-BN-2: javac-direct mirror of the above — compile src/test/java in the in-process probe too.
    include-test-compile: true
    # T4-BN-2 follow-up (2026-06-23): test-compile failures STEER, they do not GATE. When false
    # (default/fixed), a compile failure confined to test sources keeps the mutation (main work
    # proceeds, the test break is surfaced as a diagnostic); only a MAIN break rejects + rolls back.
    # This removes the main-evolution freeze that drove the 06-17→06-23 test-seed cliff (0/15 fulfilled
    # vs 3/3 on plain seeds). Completion-edge gates (mvn package / mvn test) remain the backstop that
    # tests must actually compile + pass. Set true to restore the legacy "test break == main break" gate.
    test-compile-blocks-merge: false
    # T4-BN Phase 1: compile-probe strategy.
    #   maven        — shells the `command` above (default `mvn test-compile`, ~5-15s typical per probe)
    #   javac-direct — in-process javax.tools.JavaCompiler with cached classpath (~target <1.5s)
    # The javac-direct strategy uses the JDK's own javac; falls back to maven when no
    # JavaCompiler is available (JRE-only runtime). Compatible with annotation processors
    # auto-discovered from the classpath (Lombok, MapStruct, ...).
    executor: maven
    # T4-AN-6 / T3-BV: chain deterministic fixes within one compile probe. With several
    # independent error classes present, no single fix can turn the build green — chaining lets
    # each pass target the next class against the fresh stderr. There is no fixed pass ceiling:
    # the chain terminates when no resolver produces a proposal, the build goes green, or a
    # pass fails to strictly reduce the distinct-error count (which guarantees termination).
    # Code default is false (the original one-shot behaviour). The T2-DY fix-attempt ledger
    # keeps known-failed proposals out of the chain.
    inner-fix-loop:
      enabled: true
    # T4-AN-8: runnable-artifact gate. Compile-only probes never check that the artifact is a
    # startable application (an entry point is not needed to compile). One package-level build
    # at the root-closure edge; a failure blocks completion and is injected as a work item.
    # Never runs per-cycle. The build tool decides what "packageable" means for the project.
    package-gate:
      enabled: true
      command: mvn package -DskipTests
    # T4-AN-2: test-run gate. The package gate proves the artifact assembles; this proves its
    # own tests pass. Same completion-edge-only discipline. Abstains when the project has no
    # tests (smoke-test authoring is separate work).
    test-gate:
      enabled: true
      command: mvn test
    # T4-AN-5: build-tool diagnostic probe. On COMPILE_ERROR, run the build tool's own diagnostic
    # commands (pom-level, so valid after the probe's source rollback) and surface the output in the
    # next cycle's evolution/planner prompt, so the LLM picks real dependency coordinates instead of
    # guessing. Cached per cycle; command failures/timeouts fold in as text, never thrown. Off in
    # code by default (Chain-H convention); enabled here for field validation. All ecosystem
    # knowledge is data here — adding a build system is a yaml-only change. Only `dependency:tree`
    # is configured: it answers "is this package/coordinate actually on the classpath?" (the live
    # spring-data case). `versions:display-plugin-updates` and `help:effective-pom` are deliberately
    # excluded — empirically their output is noisy/misleading for a local model (2026-06-15 check).
    diagnostics-enabled: true
    diagnostic-line-cap: 60
    diagnostic-timeout-ms: 30000
    tool-detection:
      "[pom.xml]": maven
      "[build.gradle]": gradle
      "[build.gradle.kts]": gradle
    diagnostics:
      maven:
        - "mvn dependency:tree"
      gradle:
        - "gradle dependencies"
    # T4-AN-4: adaptive build-error classifier. When `adaptive: true`, BuildErrorClassifierAgent
    # issues a small structured-output LLM call to classify stderr into a technology-agnostic
    # Category (CONFIG_FIXABLE / SOURCE_FIXABLE / MIXED / UNKNOWN) plus optional summary,
    # missing-artifact, missing-symbol, and suggested-fix hints. Results are cached forever
    # by SHA-256(stderr) in memory (the same stderr never queries the LLM twice within a run).
    # When `false` (default), only the deterministic T2-CT pattern matcher runs — same
    # behaviour as before T4-AN-4. The pattern matcher remains the fallback when the LLM
    # call fails, returns malformed JSON, or the circuit breaker is open. `model` reserves
    # a per-call model override for the follow-up that adds it to LLMClient — currently
    # logged as not yet wired through ChatRequest.
    classifier:
      adaptive: true
      # model: gpt-4o-mini  # placeholder — not yet honoured; see BuildClassifierConfigProperties
    # T4-AY: deterministic skeleton-file resolver for missing-class compile errors.
    # When the probe stderr names a symbol matching one of the patterns below and no
    # similarly-named symbol already exists under output/, the resolver writes a minimal
    # skeleton file at <establishedBasePackage>.<sub-package>.<X>.java. Templates accept
    # two substitution tokens: {className} and {packageDecl}.
    #
    # Spring @ConfigurationProperties binding REPLACES the `idioms:` list — it does not
    # merge with the Java-side defaults in IdiomSkeletonConfigProperties.defaultIdioms().
    # Deleting an entry here disables that idiom; the Java defaults only apply when the
    # whole `idioms:` key is absent. Keep this list and the Java defaults in sync.
    skeletons:
      resolver-order: 50
      similarity-abort-threshold: 2
      default-base-package: com.example.demo
      # T4-BQ: populate a freshly-created skeleton with the members its call sites prove must
      # exist, so the whole missing-type closure lands in one pass. Code default false.
      # FIELD-VALIDATED 2026-06-16 (order-checkout seed A/B): fires reliably (8 types synthesized
      # in the ON run, vs zero skeletons on the library goal) but showed NO run-outcome benefit —
      # ON ran ~2.5x longer (121 vs 55 cyc) and ended no better; both runs halted on last-mile
      # planner/criteria issues, not on type-closure. The conservative Object return/param rule
      # also created a second-order `incompatible types`/`bad operand` cascade at call sites.
      # Held OFF until the Object-typing is fixed and a benefit is demonstrated. See roadmap T4-BQ.
      synthesize-members: false
      idioms:
        - rule: skeleton-repository
          pattern: '\w+Repository'
          sub-package: repository
          description: 'Created {className} skeleton (JpaRepository<Object, Long>)'
          template: |
            package {packageDecl};

            import org.springframework.data.jpa.repository.JpaRepository;

            public interface {className} extends JpaRepository<Object, Long> {
            }
        - rule: skeleton-exception
          pattern: '\w+Exception'
          sub-package: exception
          description: 'Created {className} skeleton (extends RuntimeException)'
          template: |
            package {packageDecl};

            public class {className} extends RuntimeException {
                public {className}(String message) {
                    super(message);
                }
            }
        - rule: skeleton-service
          pattern: '\w+Service'
          sub-package: service
          description: 'Created {className} skeleton (@Service)'
          template: |
            package {packageDecl};

            import org.springframework.stereotype.Service;

            @Service
            public class {className} {
            }
        - rule: skeleton-controller
          pattern: '\w+Controller'
          sub-package: controller
          description: 'Created {className} skeleton (@RestController)'
          template: |
            package {packageDecl};

            import org.springframework.web.bind.annotation.RestController;

            @RestController
            public class {className} {
            }
  # T5-Q: retention for per-session output under file.base-path. Each directory has age
  # and size/count limits; the most recent `min-keep` entries are always preserved so a
  # fresh session never loses its own outputs. Runs on a fixed schedule (default daily);
  # skips while a cycle is in progress.
  retention:
    enabled: true
    min-keep: 100
    schedule-initial-delay-ms: 3600000
    schedule-delay-ms: 86400000
    # T5-AE: time-only retention for archived run logs. Live targets autobuilder.log /
    # behaviour.ndjson are not subject to retention (StartupLogRotator renames them on
    # JVM startup; only the renamed *-YYYY-MM-DD_HH-mm-ss.* files are pruned here).
    logs:
      max-age-days: 10
      max-size-mb: 0    # 0 = disabled — total corpus ~47 MB on disk; no size pressure
    snapshots:
      max-age-days: 14
      max-cycles: 1000
    mutations:
      max-age-days: 14
      max-cycles: 1000
    responses:
      max-age-days: 7
      max-size-mb: 200
file:
    base-path: ${FILE_BASE_PATH:/data/firestarter}
llm:
    api:
        #url: https://api.openai.com/v1/chat/completions
        url: http://localhost:11434/v1/chat/completions
        # Real provider keys come from the environment — never commit them. The fallback
        # value satisfies local endpoints (Ollama ignores auth) and fails fast on real APIs.
        key: ${OPENAI_API_KEY:local-only-no-key}
        #model: gpt-4o
        model: qwen3-coder:30b
        # Prompt-budget deployment facts (PromptTokenBudget). context-window-tokens is the
        # DEPLOYED window — for Ollama that is num_ctx / OLLAMA_CONTEXT_LENGTH, usually far
        # below the model's architectural max (qwen3-coder:30b supports 262144). Keep in sync
        # with the serving config; response-reserve-tokens is the output room left for the
        # model's reply.
        context-window-tokens: 32768
        response-reserve-tokens: 4096
        read-timeout-ms: 120000  # generous for local models; override per-environment
        retry:
            max-attempts: 3        # total attempts (1 = no retry)
            delay-ms: 5000         # wait between attempts
        #model: qwen3-30b-tuned
        #model: deepseek-coder-v2:16b
        #model: glm-4.7-flash
        #model: glm-4.7-tuned
spring:
  data:
    neo4j:
      uri: bolt://localhost:7687
      username: neo4j
      password: your_password
  jpa:
    open-in-view: false
  profiles:
    active: neo4j
  # T1-ED: meta.json round-trip robustness. Records with isXxx() bean-style getters
  # (MergeRollbackPoint, SubgoalMetadata, ProblemEntry, StructuralDiffNode) serialise an
  # extra property that record deserialisers reject. Don't fail reads on unknown fields.
  jackson:
    deserialization:
      fail-on-unknown-properties: false
server:
  port: 8081

---
# ============================================
# TEST PROFILE (NEVER RUN SCHEDULER OR BOOTSTRAP)
# ============================================
spring:
  config:
    activate:
      on-profile: test

autobuilder:
  bootstrap:
    enabled: false
  scheduler:
    enabled: false

---
# ============================================
# DEV-LOCAL PROFILE (manual cycles only)
# ============================================
spring:
  config:
    activate:
      on-profile: dev-local

autobuilder:
  bootstrap:
    enabled: true
  scheduler:
    enabled: false

---
# ============================================
# DEV-AUTO PROFILE (full autonomous loop)
# ============================================
spring:
  config:
    activate:
      on-profile: dev-auto

autobuilder:
  bootstrap:
    enabled: true
  scheduler:
    enabled: true
    inter-cycle-delay-ms: 5000