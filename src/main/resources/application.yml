autobuilder:
  diff:
    exclude-folders:
      - logs
      - test
      - responses
      - target
    exclude-files:
      - meta.json
  evaluation:
    heuristic-threshold: 0.4
    max-score-drop: 0.2
    min-changed-files: 2
    fileContentMaxLines: 150
  evolution:
    # T4-BL (lighter fix): rewrite a fragmenting write to the package its type already lives in
    # (path + package declaration + same-mutation cross-references) instead of letting the
    # T4-BH gate reject it at probe time. The gate stays as backstop for the skipped cases.
    # Code default is false; enabled here so real runs validate it (same pattern as
    # build.classifier.adaptive).
    package-consolidation:
      enabled: true
  goal:
    migrate-to-graph: false
    sync-from-graph: true
    max-consecutive-subgoal-exhaustions: 5
    min-exhausted-children-floor: 5
  service:
    reset-on-start: true
  heuristic:
    score-strategy: weightedAverageScoreAdjustmentStrategy
  criteria:
    graduation-ratio: 0.80
    graduation-min-fail-streak: 3
  parser:
    source-root: src/main/java
  # Offline neural TTS via Piper (rhasspy). Binary + voice model auto-download to
  # cache-dir on first start; subsequent runs use the cached copies. Frontend applies
  # reverb/delay on top via Web Audio API.
  tts:
    cache-dir: ${user.home}/.cache/autobuilder-piper
    voice: en_US-amy-medium
    piper-version: 2023.11.14-2
    voice-base-url: https://huggingface.co/rhasspy/piper-voices/resolve/main
    piper-base-url: https://github.com/rhasspy/piper/releases/download
  bootstrap:
    enabled: false
    # T3-BT: "auto" = copy bootstrap/build/ into output/ if present (explicit skeleton path);
    # "none" = disable seeding entirely (LLM-detected fallback requires T4-AN-5, not yet wired)
    build-system: auto
  scheduler:
    enabled: false
  # T4-AN-1: post-merge compile gate. When enabled, MergeAgent runs the configured build
  # command after every successful merge and stores the outcome on CycleContextData.
  # BuildResultHeuristic turns COMPILE_ERROR into a CRITICAL REJECTED opinion that overrides
  # every other heuristic. Off by default — target projects without a Maven setup should
  # leave this disabled.
  # TODO: "enabled: true" is currently not working correctly
  build:
    enabled: true
    command: mvn compile
    timeout-ms: 120000
    working-dir: ${FILE_BASE_PATH:/data/firestarter}/output
    # T4-BN Phase 1: compile-probe strategy.
    #   maven        — shells `mvn compile` (default, ~5-15s typical per probe)
    #   javac-direct — in-process javax.tools.JavaCompiler with cached classpath (~target <1.5s)
    # The javac-direct strategy uses the JDK's own javac; falls back to maven when no
    # JavaCompiler is available (JRE-only runtime). Compatible with annotation processors
    # auto-discovered from the classpath (Lombok, MapStruct, ...).
    executor: maven
    # T4-AN-4: adaptive build-error classifier. When `adaptive: true`, BuildErrorClassifierAgent
    # issues a small structured-output LLM call to classify stderr into a technology-agnostic
    # Category (CONFIG_FIXABLE / SOURCE_FIXABLE / MIXED / UNKNOWN) plus optional summary,
    # missing-artifact, missing-symbol, and suggested-fix hints. Results are cached forever
    # by SHA-256(stderr) in memory (the same stderr never queries the LLM twice within a run).
    # When `false` (default), only the deterministic T2-CT pattern matcher runs — same
    # behaviour as before T4-AN-4. The pattern matcher remains the fallback when the LLM
    # call fails, returns malformed JSON, or the circuit breaker is open. `model` reserves
    # a per-call model override for the follow-up that adds it to LLMClient — currently
    # logged as not yet wired through ChatRequest.
    classifier:
      adaptive: true
      # model: gpt-4o-mini  # placeholder — not yet honoured; see BuildClassifierConfigProperties
    # T4-AY: deterministic skeleton-file resolver for missing-class compile errors.
    # When the probe stderr names a symbol matching one of the patterns below and no
    # similarly-named symbol already exists under output/, the resolver writes a minimal
    # skeleton file at <establishedBasePackage>.<sub-package>.<X>.java. Templates accept
    # two substitution tokens: {className} and {packageDecl}.
    #
    # Spring @ConfigurationProperties binding REPLACES the `idioms:` list — it does not
    # merge with the Java-side defaults in IdiomSkeletonConfigProperties.defaultIdioms().
    # Deleting an entry here disables that idiom; the Java defaults only apply when the
    # whole `idioms:` key is absent. Keep this list and the Java defaults in sync.
    skeletons:
      resolver-order: 50
      similarity-abort-threshold: 2
      default-base-package: com.example.demo
      idioms:
        - rule: skeleton-repository
          pattern: '\w+Repository'
          sub-package: repository
          description: 'Created {className} skeleton (JpaRepository<Object, Long>)'
          template: |
            package {packageDecl};

            import org.springframework.data.jpa.repository.JpaRepository;

            public interface {className} extends JpaRepository<Object, Long> {
            }
        - rule: skeleton-exception
          pattern: '\w+Exception'
          sub-package: exception
          description: 'Created {className} skeleton (extends RuntimeException)'
          template: |
            package {packageDecl};

            public class {className} extends RuntimeException {
                public {className}(String message) {
                    super(message);
                }
            }
        - rule: skeleton-service
          pattern: '\w+Service'
          sub-package: service
          description: 'Created {className} skeleton (@Service)'
          template: |
            package {packageDecl};

            import org.springframework.stereotype.Service;

            @Service
            public class {className} {
            }
        - rule: skeleton-controller
          pattern: '\w+Controller'
          sub-package: controller
          description: 'Created {className} skeleton (@RestController)'
          template: |
            package {packageDecl};

            import org.springframework.web.bind.annotation.RestController;

            @RestController
            public class {className} {
            }
  # T5-Q: retention for per-session output under file.base-path. Each directory has age
  # and size/count limits; the most recent `min-keep` entries are always preserved so a
  # fresh session never loses its own outputs. Runs on a fixed schedule (default daily);
  # skips while a cycle is in progress.
  retention:
    enabled: true
    min-keep: 100
    schedule-initial-delay-ms: 3600000
    schedule-delay-ms: 86400000
    # T5-AE: time-only retention for archived run logs. Live targets autobuilder.log /
    # behaviour.ndjson are not subject to retention (StartupLogRotator renames them on
    # JVM startup; only the renamed *-YYYY-MM-DD_HH-mm-ss.* files are pruned here).
    logs:
      max-age-days: 10
      max-size-mb: 0    # 0 = disabled — total corpus ~47 MB on disk; no size pressure
    snapshots:
      max-age-days: 14
      max-cycles: 1000
    mutations:
      max-age-days: 14
      max-cycles: 1000
    responses:
      max-age-days: 7
      max-size-mb: 200
file:
    base-path: ${FILE_BASE_PATH:/data/firestarter}
llm:
    api:
        #url: https://api.openai.com/v1/chat/completions
        url: http://localhost:11434/v1/chat/completions
        key: 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
        #model: gpt-4o
        model: qwen3-coder:30b
        read-timeout-ms: 120000  # generous for local models; override per-environment
        retry:
            max-attempts: 3        # total attempts (1 = no retry)
            delay-ms: 5000         # wait between attempts
        #model: qwen3-30b-tuned
        #model: deepseek-coder-v2:16b
        #model: glm-4.7-flash
        #model: glm-4.7-tuned
spring:
  data:
    neo4j:
      uri: bolt://localhost:7687
      username: neo4j
      password: your_password
  jpa:
    open-in-view: false
  profiles:
    active: neo4j
  # T1-ED: meta.json round-trip robustness. Records with isXxx() bean-style getters
  # (MergeRollbackPoint, SubgoalMetadata, ProblemEntry, StructuralDiffNode) serialise an
  # extra property that record deserialisers reject. Don't fail reads on unknown fields.
  jackson:
    deserialization:
      fail-on-unknown-properties: false
server:
  port: 8081

---
# ============================================
# TEST PROFILE (NEVER RUN SCHEDULER OR BOOTSTRAP)
# ============================================
spring:
  config:
    activate:
      on-profile: test

autobuilder:
  bootstrap:
    enabled: false
  scheduler:
    enabled: false

---
# ============================================
# DEV-LOCAL PROFILE (manual cycles only)
# ============================================
spring:
  config:
    activate:
      on-profile: dev-local

autobuilder:
  bootstrap:
    enabled: true
  scheduler:
    enabled: false

---
# ============================================
# DEV-AUTO PROFILE (full autonomous loop)
# ============================================
spring:
  config:
    activate:
      on-profile: dev-auto

autobuilder:
  bootstrap:
    enabled: true
  scheduler:
    enabled: true
    inter-cycle-delay-ms: 5000