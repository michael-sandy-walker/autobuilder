autobuilder:
  run:
    # T2-FH: the wall-clock budget the harness gives this run, in minutes. The convergence brake
    # reads it to tell "stop this waste" from "stop this run with 63 of its 90 minutes unspent".
    # 0 = undeclared, which is what a run started by hand has: the brake then makes no claim
    # about time and decides on the trend alone. scripts/preflight.sh passes its own cap.
    budget-minutes: 0
  # T4-DQ: checkpoint, rewind and backtracking. The expensive half already ran before this
  # existed — the output tree is copied to snapshots/<cycleId>/ every cycle and the whole cycle
  # context is serialised to mutations/<cycleId>/meta.json — so what a checkpoint adds is the
  # decision-bearing in-memory state and a cut point in the goal-status history.
  checkpoint:
    enabled: true
    # Points kept on disk, pruned oldest-first. The JSON is small; the bound is there because an
    # unbounded per-cycle directory is how snapshots/ reached hundreds of megabytes.
    retain: 40
    # Archived trees kept in total, across runs, pruned oldest-first. 2000 is roughly fifty runs
    # at forty cycles each — bounded by count rather than by the run boundary.
    archive-retain: 2000
  rewind:
    # Two: a run that has ground twice from two different points is saying something a third
    # rewind will not fix, and each one discards wall clock the budget still charges for.
    max-per-run: 2
    # FAITHFUL restores cache/ with the state; FRESH clears it. The DIFFERENCE between the two is
    # itself the instrument — if outcomes differ, the resolution cache is decision-bearing rather
    # than a pure optimisation, which nobody currently knows.
    cache-mode: FAITHFUL
    # Whether an AUTOMATIC rewind may leave the run it is in. OFF: the loop backs out only to
    # points its own run took; reaching into an earlier run of the lineage stays a manual action.
    # The checkpoint directory and the cross-run index both outlive the run that filled them, so
    # "the newest point that landed work" silently reaches backwards — which is how a stalled run
    # adopted a FINISHED earlier one's state on 2026-09-03 and halted on the next cycle. Crossing a
    # run boundary changes whose work is being continued, and that is a judgement for a person
    # looking at the runs rather than for a grind detector. The operator rewind is unaffected and
    # still offers every restorable point, marked with the run it belongs to.
    auto-cross-run-enabled: false
  replay:
    # OFF | RECORD | REPLAY. RECORD writes every LLM answer to llm-recordings/exchanges.ndjson;
    # REPLAY answers from it, which is what makes a rewind's round trip provable (an uncaptured
    # piece of state shows up as the loop asking a question the recording does not contain) and
    # what makes a recorded run replayable against a changed build.
    mode: OFF
    # In REPLAY, whether an unrecorded prompt stops the replay (true) or falls through to the live
    # model (false). Strict is right for the round-trip proof; lenient for replaying against a
    # changed build, where some divergence is the thing being measured.
    strict: false
  diff:
    # T4-CQ 2026-09-05: matched by PATH SEGMENT, not prefix. A tree the loop wrote keeps these at
    # the root; an imported one puts build tooling anywhere, and `.mvn/wrapper/maven-wrapper.jar`
    # broke the diff on every cycle of the first imported run.
    # `test` REMOVED 2026-09-05. It was there for the loop's own scratch folder, which lives at
    # data/<target>/test — a SIBLING of output/, so the diff never saw it and the entry never
    # matched anything. Under segment matching it would have started matching src/test/java, i.e.
    # a project's own tests, making a change to them invisible to the loop that wrote it.
    # `logs` / `responses` REMOVED 2026-09-24 (T5-BL). The loop writes both beside output/, never
    # inside a diffed tree (output/, mutations/<cycle>/, snapshots/), so they matched nothing in any
    # tree measured; under segment matching they would only hide a target's own `logs` package.
    exclude-folders:
      - target
      - .mvn
      - .git
      - .idea
      - .gradle
      - node_modules
      - build
      - out
    exclude-files:
      - meta.json
  evaluation:
    # T2-FI: a per-file character budget for the evaluation prompt. The 150-line cap this replaces
    # was in practice a 4000-character one, so the model scored mutations from roughly the first
    # hundred lines of a changed file. See CriteriaVerificationService for the same defect at the
    # closure edge, where it produced a measured false completion.
    fileContentBudgetChars: 40000
  goal:
    # T4-CU residual (1): may a criterion the deterministic synthesizer cannot build a probe for
    # fall back to the model AT THE CLOSURE EDGE? BootGate reserves this for exactly this caller
    # ("only the completion edge should pass true") and the caller passed false from the day it
    # shipped, so the fallback has never once run in the field.
    #
    # Turned on 2026-09-19. The exposure is bounded but sits at its own limit: BootGate caps the
    # fallback at 5 calls per sweep and the circuit breaker opens on 5 consecutive failures, so one
    # sweep against an unhealthy model is precisely enough to open it -- which is how run
    # 2026-08-05_20-58-50 died. T1-FD (timed opens) and T1-FL (resume when the cooldown elapses)
    # both post-date that and would now turn the kill into a pause, but NEITHER HAS FIRED IN THE
    # FIELD: zero breaker-terminal runs in the 71 since. Dormant protection, not proven protection.
    #
    # Watch after enabling: breaker opens per run, and whether closure sweeps recur often enough
    # for 5-per-sweep to add up -- one archived run made 34 closure attempts.
    closure-probe-model-fallback: true
    migrate-to-graph: false
    sync-from-graph: true
    max-consecutive-subgoal-exhaustions: 5
    min-exhausted-children-floor: 5
    admission-cap: 6
    # T4-AJ Part B: catch-up consolidation of equivalent goals (shared reviewer).
    consolidation:
      stagnation-streak: 3
      active-leaf-threshold: 10
      max-reviewer-calls: 5
      similarity-floor: 0.5
      # T2-EC grace window is derived, not configured: leaf count alone only triggers after a
      # merge landed or one observed cycle per active leaf passed (scales with tree size).
  start:
    # T4-DP: how a run begins, in ONE place. Was an accident of five flags, and the standard entry
    # point defaulted to the destructive one — on 2026-09-03 that would have deleted an imported
    # project before its first cycle.
    #   NEW_PROJECT      clear output/ and seed the root goal from bootstrap/seed.txt
    #   CONTINUE_LINEAGE resume a lineage this loop built before; never clears
    #   ADOPT_PROJECT    work on a codebase the loop did not write; never clears, never seeds over it
    #   ASK              touch nothing and wait to be told. A resting state, not a pause before a
    #                    default: nothing here times out into an action.
    # The mode is checked against what is actually in the tree, so NEW_PROJECT is REFUSED on a
    # codebase the loop did not write rather than quietly deleting it.
    mode: NEW_PROJECT
    # The one escape hatch, deliberately awkward to reach: discard a foreign codebase on purpose.
    confirm-discard-foreign-tree: false
  service:
    reset-on-start: true
    # T4-CD slice 1: resume a preserved prior lineage at boot (output/ from meta/preserved-artifact/,
    # goal state kept + re-grounded). Wins over reset-on-start when resumable state exists;
    # falls through to it otherwise — so both flags together mean "resume if possible, else fresh".
    resume-from-preserved: false
  preserve:
    # T3-BY: preserve the best verified snapshot every N MERGED cycles during the run, not only
    # at an in-process terminal. Measured over 64 runs: 4 ended after their peak and all 4 scored
    # 0 (one spent 64 cycles past a 22/23 peak), and every one was killed from outside — where
    # the terminal-only hook never runs. preserve() runs a build probe per candidate, so this is
    # interval-gated; 0 restores the pre-T3-BY terminal-only behaviour.
    #
    # 10 -> 5 on 2026-08-23 after the first field firing: run 2026-08-23_01-15-20 preserved once
    # in 17 merged cycles and scored smoke=18/23 against smoke_preserved=14/23, i.e. the copy
    # lagged the final tree by 7 merges. Nothing was masked (the two scores are reported
    # separately), but a stale copy is a weaker rescue, and the whole point is to be NEAR the peak
    # when a run dies past it. Cost of halving the interval: about one extra build probe per 5
    # merged cycles -- against a ~3.4 s probe and a ~75 s median cycle, under 1%.
    interval-cycles: 5
  heuristic:
    score-strategy: weightedAverageScoreAdjustmentStrategy
  criteria:
    graduation-ratio: 0.80
    graduation-min-fail-streak: 3
  parser:
    source-root: src/main/java
  # T4-EE: an agent retrying rejected work may first ask one question of this run's log; a model
  # probes the log (search / read / count) and answers. Off until a field run shows it used.
  log-consultation:
    enabled: false
  # Offline neural TTS via Piper (rhasspy). Binary + voice model auto-download to
  # cache-dir on first start; subsequent runs use the cached copies. Frontend applies
  # reverb/delay on top via Web Audio API.
  tts:
    cache-dir: ${user.home}/.cache/autobuilder-piper
    voice: en_US-amy-medium
    piper-version: 2023.11.14-2
    voice-base-url: https://huggingface.co/rhasspy/piper-voices/resolve/main
    piper-base-url: https://github.com/rhasspy/piper/releases/download
  bootstrap:
    enabled: false
    # T3-BT: "auto" = copy bootstrap/build/ into output/ if present (explicit skeleton path);
    # "none" = disable seeding entirely (LLM-detected fallback requires T4-AN-5, not yet wired)
    build-system: auto
  scheduler:
    enabled: false
  # T4-AN-1: post-merge compile gate. When enabled, MergeAgent runs the configured build
  # command after every successful merge and stores the outcome on CycleContextData.
  # The pre-merge compile probe rejects a candidate that does not compile, and a post-merge
  # COMPILE_ERROR rolls the merge back. Off by default — target projects without a Maven setup should
  # leave this disabled.
  build:
    enabled: true
    # T4-BN-2 REVERTED 2026-06-23 (bisect-confirmed regression): the per-cycle probe compiles MAIN
    # only. T4-BN-2 had flipped this to `mvn test-compile` so test breaks steer in-cycle, but that
    # silently REGRESSED main-coherence across the board — git-bisect from the pushed main pinned the
    # 06-17→06-23 "nothing fulfills" cliff to exactly this flip. Mechanism: the local model writes
    # stray test sources even on a no-test goal; `mvn test-compile` then fails the WHOLE probe
    # (tests reference not-yet-built main types and/or missing test deps), rejecting the main-green
    # mutation and freezing main. Single-variable proof (plain seed, curated branch): `mvn compile`
    # vs `mvn test-compile` → cannot-find-symbol 61 vs 1534, OK-ratio 0.60 vs 0.26. Test correctness
    # is verified at the completion edge instead (package-gate + test-gate + T4-AN-2b), where it
    # cannot freeze per-cycle main evolution.
    command: mvn compile
    # T4-BN-3 scoped probe (2026-07-06): when the staged mutation ITSELF touches src/test, the
    # probe uses this wider command instead — the mutation's own test break is visible in-cycle
    # (steer for mixed mutations, gate for test-only ones), while main-only mutations keep the
    # main-only `command` above, so the reverted blanket flip cannot recur. Field motivation:
    # run 17 (2026-07-06) merged born-broken tests invisibly and died in closure churn on them.
    test-scope-command: mvn test-compile
    timeout-ms: 120000
    working-dir: ${FILE_BASE_PATH:data/firestarter}/output
    # T4-BN-2 reverted: javac-direct probe compiles main only too (mirror of `mvn compile` above).
    include-test-compile: false
    # T4-BM (2026-07-08): project-aware package discovery — a missing symbol/package resolves
    # from the project's OWN observations (resolved classpath -> imports -> coordinate search)
    # before any registry row or LLM lookup. The search source fires only with an exact FQN in
    # hand (fc: query); it self-disables for the session after 3 consecutive network failures.
    # The registry's tables are FALLBACK ONLY now — file discovery improvements, not row-adds.
    discovery:
      search-enabled: true
      search-url: https://search.maven.org/solrsearch/select
      search-timeout-ms: 2500
    # T4-BN Phase 1: compile-probe strategy.
    #   maven        — shells the `command` above (default `mvn test-compile`, ~5-15s typical per probe)
    #   javac-direct — in-process javax.tools.JavaCompiler with cached classpath (~target <1.5s)
    # The javac-direct strategy uses the JDK's own javac; falls back to maven when no
    # JavaCompiler is available (JRE-only runtime). Compatible with annotation processors
    # auto-discovered from the classpath (Lombok, MapStruct, ...).
    executor: maven
    # T4-AN-8: runnable-artifact gate. Compile-only probes never check that the artifact is a
    # startable application (an entry point is not needed to compile). One package-level build
    # at the root-closure edge; a failure blocks completion and is injected as a work item.
    # Never runs per-cycle. The build tool decides what "packageable" means for the project.
    package-gate:
      enabled: true
      command: mvn package -DskipTests
      # Evasion #3 (2026-07-03): a declared-but-never-executed packaging plugin yields exit 0 and
      # an unlaunchable plain archive (no Main-Class manifest). When the target's own build config
      # contains one of these markers (application-packaging intent, ecosystem DATA — T4-BM),
      # the produced archive must carry an entry-point manifest attribute. Comma-separated.
      application-packaging-markers: spring-boot-maven-plugin
    # T4-AN-2: test-run gate. The package gate proves the artifact assembles; this proves its
    # own tests pass. Same completion-edge-only discipline. Abstains when the project has no
    # tests (smoke-test authoring is separate work).
    test-gate:
      enabled: true
      command: mvn test
    # T4-BV: execution-observation boot gate. Packaging and compiling prove nothing about runtime —
    # the 2026-07-02/03 fulfilled artifacts passed every static gate with their spec-named
    # endpoints unreachable in the RUNNING application, and false completion #2's jar died at
    # launch. Launch the freshly packaged artifact once per completion claim, wait for HTTP,
    # probe the spec's parameterless GET endpoints; crash/silence/404/5xx blocks completion as a
    # work item. Ecosystem data lives here: {artifact}/{port} substitute into the command, and
    # SERVER_PORT is honoured by Spring Boot's relaxed binding even when the generated main()
    # forgets to forward args (command-line --server.port would then be ignored).
    boot-gate:
      enabled: true
      command: java -jar {artifact}
      port-env-var: SERVER_PORT
      readiness-timeout-ms: 60000
      request-timeout-ms: 5000
    diagnostic-line-cap: 60
    diagnostic-timeout-ms: 30000
    tool-detection:
      "[pom.xml]": maven
      "[build.gradle]": gradle
      "[build.gradle.kts]": gradle
      "[settings.gradle]": gradle
      "[settings.gradle.kts]": gradle
    diagnostics:
      maven:
        - "mvn dependency:tree"
      gradle:
        - "gradle dependencies"
    # T4-AU: file-role registry consumed by FileRoleClassifier. All file-role knowledge is data
    # here — the classifier and its callers name no filenames/directories of their own.
    output-directories:
      maven: [target]
      gradle: [build, .gradle]
    test-directories:
      maven: [src/test]
      gradle: [src/test]
    resource-directories:
      maven: [src/main/resources, src/test/resources]
      gradle: [src/main/resources, src/test/resources]
    source-extensions: [.java]
    # T4-AN-4: adaptive build-error classifier. When `adaptive: true`, BuildErrorClassifierAgent
    # issues a small structured-output LLM call to classify stderr into a technology-agnostic
    # Category (CONFIG_FIXABLE / SOURCE_FIXABLE / MIXED / UNKNOWN) plus optional summary,
    # missing-artifact, missing-symbol, and suggested-fix hints. Results are cached forever
    # by SHA-256(stderr) in memory (the same stderr never queries the LLM twice within a run).
    # When `false` (default), only the deterministic T2-CT pattern matcher runs — same
    # behaviour as before T4-AN-4. The pattern matcher remains the fallback when the LLM
    # call fails, returns malformed JSON, or the circuit breaker is open. `model` reserves
    # a per-call model override for the follow-up that adds it to LLMClient — currently
    # logged as not yet wired through ChatRequest.
    # T4-AY: deterministic skeleton-file resolver for missing-class compile errors.
    # When the probe stderr names a symbol matching one of the patterns below and no
    # similarly-named symbol already exists under output/, the resolver writes a minimal
    # skeleton file at <establishedBasePackage>.<sub-package>.<X>.java. Templates accept
    # two substitution tokens: {className} and {packageDecl}.
    #
    # Spring @ConfigurationProperties binding REPLACES the `idioms:` list — it does not
    # merge with the Java-side defaults in IdiomSkeletonConfigProperties.defaultIdioms().
    # Deleting an entry here disables that idiom; the Java defaults only apply when the
    # whole `idioms:` key is absent. Keep this list and the Java defaults in sync.
    skeletons:
      resolver-order: 50
      similarity-abort-threshold: 2
      default-base-package: com.example.demo
      idioms:
        - rule: skeleton-repository
          pattern: '\w+Repository'
          sub-package: repository
          description: 'Created {className} skeleton (JpaRepository<Object, Long>)'
          template: |
            package {packageDecl};

            import org.springframework.data.jpa.repository.JpaRepository;

            public interface {className} extends JpaRepository<Object, Long> {
            }
        - rule: skeleton-exception
          pattern: '\w+Exception'
          sub-package: exception
          description: 'Created {className} skeleton (extends RuntimeException)'
          template: |
            package {packageDecl};

            public class {className} extends RuntimeException {
                public {className}(String message) {
                    super(message);
                }
            }
        - rule: skeleton-service
          pattern: '\w+Service'
          sub-package: service
          description: 'Created {className} skeleton (@Service)'
          template: |
            package {packageDecl};

            import org.springframework.stereotype.Service;

            @Service
            public class {className} {
            }
        - rule: skeleton-controller
          pattern: '\w+Controller'
          sub-package: controller
          description: 'Created {className} skeleton (@RestController)'
          template: |
            package {packageDecl};

            import org.springframework.web.bind.annotation.RestController;

            @RestController
            public class {className} {
            }
  # T5-Q: retention for per-session output under file.base-path. Each directory has age
  # and size/count limits; the most recent `min-keep` entries are always preserved so a
  # fresh session never loses its own outputs. Runs on a fixed schedule (default daily);
  # skips while a cycle is in progress.
  retention:
    enabled: true
    min-keep: 100
    schedule-initial-delay-ms: 3600000
    schedule-delay-ms: 86400000
    # T5-AE: time-only retention for archived run logs. Live targets autobuilder.log /
    # behaviour.ndjson are not subject to retention (StartupLogRotator renames them on
    # JVM startup; only the renamed *-YYYY-MM-DD_HH-mm-ss.* files are pruned here).
    #
    # max-active-days counts days on which the directory RECEIVED something, not calendar days:
    # a week with no runs does not age the corpus out. Changed from calendar days 2026-08-23
    # after T6-M found only 4 of 28 failing runs still had a log — the failures predated a
    # 10-CALENDAR-day window that idle days had eaten into. Retains more, never less.
    logs:
      max-active-days: 10
      max-size-mb: 0    # 0 = disabled — total corpus ~47 MB on disk; no size pressure
    snapshots:
      max-active-days: 14
      max-cycles: 1000
    mutations:
      max-active-days: 14
      max-cycles: 1000
    responses:
      max-active-days: 7
      max-size-mb: 200
file:
    base-path: ${FILE_BASE_PATH:data/firestarter}
llm:
    api:
        #url: https://api.openai.com/v1/chat/completions
        url: http://localhost:11434/v1/chat/completions
        # Real provider keys come from the environment — never commit them. The fallback
        # value satisfies local endpoints (Ollama ignores auth) and fails fast on real APIs.
        key: ${OPENAI_API_KEY:local-only-no-key}
        #model: gpt-4o
        model: qwen3.8
        # Prompt-budget deployment facts (PromptTokenBudget). context-window-tokens is the
        # DEPLOYED window — for Ollama that is num_ctx / OLLAMA_CONTEXT_LENGTH, usually far
        # below the model's architectural max (qwen3-coder:30b supports 262144). Keep in sync
        # with the serving config; response-reserve-tokens is the output room left for the
        # model's reply.
        context-window-tokens: 32768
        response-reserve-tokens: 4096
        # Reasoning budget for models that think before answering ("none"/"low"/"medium"/"high").
        # Blank = send nothing, so the model keeps its own default and non-reasoning endpoints see
        # no change. Measured on a ~9.3k-token verifier prompt with qwen3.8: default reasoning
        # spends ~700-850 hidden tokens for 19-21 s per call, "none" answers the same in 1.8 s.
        # Those hidden tokens also come out of response-reserve-tokens above. Set to "none" on
        # 2026-08-22: on the T5-AF hollow/real corpus qwen3.8 scored precision 1.00 / recall 1.00
        # with reasoning suppressed and 0.83 / 1.00 with it at the model's default, so the hidden
        # tokens bought a false alarm and a ~10x slower call. Blank it to restore the default.
        reasoning-effort: none
        read-timeout-ms: 120000  # generous for local models; override per-environment
        # T1-FP: escalate the read timeout on retries so a slow-but-progressing local generation
        # (large prompt / cold model reload) can finish on a later attempt instead of timing out
        # at the base on every try and tripping the circuit breaker into an endless pause. Attempt
        # N timeout = base * factor^(N-1), capped. factor 1.0 = disabled (flat base). With base
        # 120s + 3 attempts: 120s, 180s, 270s.
        read-timeout-escalation-factor: 1.5
        read-timeout-max-ms: 300000
        retry:
            max-attempts: 3        # total attempts (1 = no retry)
            delay-ms: 5000         # wait between attempts
        #model: qwen3-30b-tuned
        #model: deepseek-coder-v2:16b
        #model: glm-4.7-flash
        #model: glm-4.7-tuned
spring:
  data:
    neo4j:
      uri: bolt://localhost:7687
      username: neo4j
      password: your_password
  jpa:
    open-in-view: false
  profiles:
    active: neo4j
  # T1-ED: meta.json round-trip robustness. Records with isXxx() bean-style getters
  # (MergeRollbackPoint, SubgoalMetadata, ProblemEntry, StructuralDiffNode) serialise an
  # extra property that record deserialisers reject. Don't fail reads on unknown fields.
  jackson:
    deserialization:
      fail-on-unknown-properties: false
server:
  port: 8081

---
# ============================================
# TEST PROFILE (NEVER RUN SCHEDULER OR BOOTSTRAP)
# ============================================
spring:
  config:
    activate:
      on-profile: test

autobuilder:
  bootstrap:
    enabled: false
  scheduler:
    enabled: false

---
# ============================================
# DEV-LOCAL PROFILE (manual cycles only)
# ============================================
spring:
  config:
    activate:
      on-profile: dev-local

autobuilder:
  bootstrap:
    enabled: true
  scheduler:
    enabled: false
  # T4-CQ: write bootstrap/seed.obligations.txt, rule:/gate: markers included, when a root goal is
  # set and the target has no usable one. Off by default so a test context never calls a model.
  obligations:
    generate: true

---
# ============================================
# DEV-AUTO PROFILE (full autonomous loop)
# ============================================
spring:
  config:
    activate:
      on-profile: dev-auto

autobuilder:
  bootstrap:
    enabled: true
  scheduler:
    enabled: true
    inter-cycle-delay-ms: 5000
  # T4-CQ: write bootstrap/seed.obligations.txt, rule:/gate: markers included, when a root goal is
  # set and the target has no usable one. Off by default so a test context never calls a model.
  obligations:
    generate: true

---
# ============================================
# FAST PROFILE (overhead-trim only — does NOT change decision logic)
# ============================================
# Use ALONGSIDE another profile, e.g. `--spring.profiles.active=dev-auto,fast`.
# Purpose: shave wall-clock from outcome-checking runs WITHOUT distorting outcomes — it only
# removes time the loop spends waiting/probing, never anything that changes what the loop decides.
# Honest ceiling: ~10-15%. Per-run cost is dominated by LLM inference (~80% of wall-clock), which
# this cannot touch without changing behaviour (fewer agent calls / cycles would change outcomes).
# For FAST CORRECTNESS checks of a mechanism, do NOT use a loop at all — use the deterministic
# harness/eval pattern (single-call, seconds, zero variance), which is the real fast path.
#   inter-cycle-delay-ms: 1  — minimal scheduler pause (the @Scheduled fixedDelay must be > 0, so
#     0 is invalid and crashes startup with IllegalArgumentException — use 1ms, effectively nil).
#   executor: javac-direct   — OPT-IN further speedup (probe ~1.5s vs 5-15s). Left as `maven` here:
#     after the T4-BN-2 probe-command regression, the javac-direct vs maven equivalence wants a
#     re-check before it rides in a "behaviour-unchanged" profile. Flip it explicitly if desired.
spring:
  config:
    activate:
      on-profile: fast

autobuilder:
  scheduler:
    inter-cycle-delay-ms: 1