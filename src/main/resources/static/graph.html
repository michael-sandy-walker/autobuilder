<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Autobuilder · Live Goal Graph (3D)</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #05070d; color: #e5e7eb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  a { color: #60a5fa; text-decoration: none; }
  a:hover { text-decoration: underline; }

  header { position: fixed; top: 0; left: 0; right: 0; height: 42px; z-index: 50;
    display: flex; align-items: center; gap: 16px; padding: 0 16px;
    background: rgba(11,18,32,0.85); border-bottom: 1px solid #1f2937; backdrop-filter: blur(8px); }
  header h1 { font-size: 13px; margin: 0; font-weight: 600; letter-spacing: 0.3px; color: #fff; }
  header .pill { font-size: 11px; padding: 2px 10px; border-radius: 999px;
    background: #1f2937; color: #9ca3af; border: 1px solid #374151; }
  header .pill.live { background: #065f46; color: #6ee7b7; border-color: #047857; }
  header .pill.stale { background: #451a03; color: #fdba74; border-color: #7c2d12; }
  header .pill.disconnected { background: #450a0a; color: #fca5a5; border-color: #7f1d1d; }
  header .spacer { flex: 1; }
  header button, header label { background: #1f2937; color: #e5e7eb; border: 1px solid #374151;
    padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  header button:hover, header label:hover { background: #374151; }
  header button.active { background: #2563eb; border-color: #3b82f6; color: #fff; }
  header input[type=checkbox] { vertical-align: middle; margin-right: 4px; }
  header select { background: #1f2937; color: #e5e7eb; border: 1px solid #374151;
    padding: 3px 6px; border-radius: 4px; font-size: 11px; margin-left: 4px; }
  header .filter-group { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: #9ca3af; }
  header .filter-group.active { color: #fbbf24; }

  #graph { position: fixed; inset: 42px 360px 0 0; background: radial-gradient(ellipse at center, #0b1220 0%, #05070d 100%); }

  aside#side { position: fixed; top: 42px; right: 0; bottom: 0; width: 360px;
    background: #0b1220; border-left: 1px solid #1f2937; display: flex; flex-direction: column; }
  aside#side .tabs { display: flex; border-bottom: 1px solid #1f2937; }
  aside#side .tabs button { flex: 1; padding: 10px 8px; background: #0b1220; color: #9ca3af;
    border: none; border-bottom: 2px solid transparent; cursor: pointer; font-size: 12px; letter-spacing: 0.3px;
    text-transform: uppercase; font-weight: 600; }
  aside#side .tabs button.active { color: #fff; border-bottom-color: #3b82f6; background: #111a2b; }
  aside#side .panel { flex: 1; overflow: auto; padding: 14px 18px; }
  aside#side .empty { color: #6b7280; font-style: italic; padding: 40px 0; text-align: center; font-size: 13px; }

  h2 { font-size: 14px; margin: 0 0 6px 0; color: #fff; font-weight: 600; word-break: break-word; }
  h3 { font-size: 10px; margin: 18px 0 6px 0; color: #6b7280; text-transform: uppercase;
    letter-spacing: 1.2px; font-weight: 600; }
  .subtitle { font-size: 12px; color: #9ca3af; margin: 0 0 12px 0; word-break: break-word; line-height: 1.5; }
  .desc-edit { width: 100%; min-height: 52px; background: #05070d; border: 1px solid #1f2937;
    color: #e5e7eb; padding: 6px 8px; border-radius: 4px; font: inherit; font-size: 12px; resize: vertical; }

  .badge { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
  .badge.ACTIVE { background: #1e3a8a; color: #bfdbfe; }
  .badge.COMPLETED { background: #064e3b; color: #a7f3d0; }
  .badge.GIVEN_UP { background: #7f1d1d; color: #fecaca; }
  .badge.FULFILLED { background: #78350f; color: #fde68a; }
  .badge.neutral { background: #1f2937; color: #9ca3af; }

  dl.kv { display: grid; grid-template-columns: 120px 1fr; gap: 4px 12px; font-size: 11px; margin: 0; }
  dl.kv dt { color: #6b7280; }
  dl.kv dd { margin: 0; color: #e5e7eb; word-break: break-word; }

  table.crit { width: 100%; border-collapse: collapse; font-size: 11px; }
  table.crit th { text-align: left; padding: 6px 6px; color: #6b7280; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.8px; border-bottom: 1px solid #1f2937; font-size: 9px; }
  table.crit td { padding: 6px 6px; border-bottom: 1px solid #0f1724; vertical-align: top; }
  table.crit td.center { text-align: center; }
  .pass { color: #6ee7b7; font-weight: 700; }
  .fail { color: #fca5a5; font-weight: 700; }
  .muted { color: #4b5563; }
  .small-btn { font-size: 10px; background: #1f2937; color: #9ca3af; border: 1px solid #374151;
    padding: 2px 6px; border-radius: 3px; cursor: pointer; }
  .small-btn:hover { background: #374151; color: #e5e7eb; }
  .small-btn.green { background: #064e3b; border-color: #047857; color: #6ee7b7; }
  .small-btn.green:hover { background: #047857; }

  .chip { display: inline-block; background: #111a2b; border: 1px solid #1f2937; color: #9ca3af;
    padding: 1px 6px; margin: 1px; border-radius: 3px; font-size: 10px; font-family: ui-monospace, monospace; }
  .chip.active { background: #1e3a8a; color: #bfdbfe; border-color: #3b82f6; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .actions button { padding: 6px 8px; background: #111a2b; color: #e5e7eb; border: 1px solid #1f2937;
    border-radius: 4px; cursor: pointer; font-size: 11px; text-align: left; }
  .actions button:hover { background: #1f2937; }
  .actions button.danger { color: #fca5a5; border-color: #450a0a; }
  .actions button.danger:hover { background: #450a0a; }
  .actions button.primary { color: #fff; background: #1e3a8a; border-color: #3b82f6; }
  .actions button.primary:hover { background: #2563eb; }
  .actions button:disabled { opacity: 0.4; cursor: not-allowed; }

  /* inject form */
  .form { margin-top: 8px; }
  .form input, .form textarea { width: 100%; background: #05070d; color: #e5e7eb;
    border: 1px solid #1f2937; padding: 6px 8px; border-radius: 4px; font: inherit; font-size: 11px;
    margin-bottom: 6px; }
  .form textarea { resize: vertical; min-height: 56px; }

  /* signals panel */
  .signal-row { display: flex; align-items: center; gap: 8px; font-size: 11px; padding: 4px 0;
    border-bottom: 1px solid #0f1724; }
  .signal-name { flex: 0 0 155px; color: #e5e7eb; font-family: ui-monospace, monospace; font-size: 10px; }
  .signal-bar { flex: 1; height: 6px; background: #0f1724; border-radius: 3px; overflow: hidden; position: relative; }
  .signal-bar > span { display: block; height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, #3b82f6, #8b5cf6); transition: width 0.25s ease; }
  .signal-val { flex: 0 0 36px; text-align: right; color: #9ca3af; font-family: ui-monospace, monospace; font-size: 10px; }
  .signal-legend { font-size: 10px; color: #6b7280; margin-bottom: 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; margin-bottom: 12px; font-size: 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; color: #9ca3af; }
  .legend-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }

  /* toast */
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(17,26,43,0.95); border: 1px solid #1f2937; color: #e5e7eb;
    padding: 8px 14px; border-radius: 4px; font-size: 12px; opacity: 0; transition: opacity 0.25s ease;
    pointer-events: none; z-index: 100; max-width: 560px; }
  #toast.show { opacity: 1; }
  #toast.error { border-color: #7f1d1d; color: #fca5a5; }
  #toast.ok { border-color: #047857; color: #6ee7b7; }

  .tiny { font-size: 10px; color: #6b7280; }

  /* per-goal cycles panel */
  details.cycle { margin: 4px 0; font-size: 11px; background: #0f1724; border: 1px solid #1f2937;
    border-radius: 4px; padding: 4px 8px; }
  details.cycle > summary { cursor: pointer; list-style: none; display: flex;
    align-items: center; gap: 6px; color: #e5e7eb; padding: 2px 0;
    font-family: ui-monospace, monospace; font-size: 11px; }
  details.cycle > summary::-webkit-details-marker { display: none; }
  details.cycle > summary::before { content: '▸ '; color: #4b5563; }
  details.cycle[open] > summary::before { content: '▾ '; }
  details.cycle .merged-pill { font-size: 9px; padding: 1px 6px; border-radius: 999px;
    background: #064e3b; color: #6ee7b7; border: 1px solid #047857; text-transform: uppercase;
    letter-spacing: 0.4px; font-weight: 600; }
  details.cycle .merged-pill.no { background: #1f2937; color: #6b7280; border-color: #374151; }
  details.cycle .cycle-files { margin-top: 4px; padding-left: 14px; }
  details.cycle .file-row { display: flex; align-items: center; gap: 4px; padding: 1px 0;
    font-family: ui-monospace, monospace; font-size: 10px; color: #9ca3af; }
  details.cycle .file-row .file-name { flex: 1; word-break: break-all; cursor: pointer; }
  details.cycle .file-row .file-name:hover { color: #60a5fa; text-decoration: underline; }

  /* in-browser editor modal */
  #editor-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 150;
    display: none; align-items: center; justify-content: center; }
  #editor-overlay.open { display: flex; }
  #editor-modal { width: min(960px, 92vw); height: min(720px, 90vh); background: #0b1220;
    border: 1px solid #374151; border-radius: 6px; display: flex; flex-direction: column;
    box-shadow: 0 16px 48px rgba(0,0,0,0.7); }
  #editor-header { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    border-bottom: 1px solid #1f2937; font-size: 12px; }
  #editor-header .editor-path { flex: 1; font-family: ui-monospace, monospace; font-size: 11px;
    color: #e5e7eb; word-break: break-all; }
  #editor-header button { background: #1f2937; color: #e5e7eb; border: 1px solid #374151;
    padding: 4px 10px; border-radius: 3px; cursor: pointer; font-size: 11px; }
  #editor-header button:hover { background: #374151; }
  #editor-header button.primary { background: #1e3a8a; color: #fff; border-color: #3b82f6; }
  #editor-header button.primary:hover { background: #2563eb; }
  #editor-textarea { flex: 1; resize: none; background: #05070d; color: #e5e7eb;
    border: none; padding: 12px; font-family: ui-monospace, monospace; font-size: 12px;
    line-height: 1.5; outline: none; tab-size: 2; }
  #editor-status { padding: 4px 12px; font-size: 10px; color: #6b7280;
    border-top: 1px solid #1f2937; display: flex; align-items: center; gap: 8px; }
  #editor-status .dot { width: 6px; height: 6px; border-radius: 50%; background: #6b7280; }
  #editor-status.dirty .dot { background: #f59e0b; }
  #editor-status.saved .dot { background: #10b981; }
  #editor-status.error .dot { background: #ef4444; }
  #editor-modal.readonly #editor-textarea { background: #08101e; color: #cbd5e1; }
  #editor-modal.readonly #editor-save { display: none; }
  #editor-modal.readonly #editor-revert { display: none; }
  #editor-header .ro-badge { font-size: 9px; padding: 1px 6px; border-radius: 999px;
    background: #78350f; color: #fde68a; border: 1px solid #92400e;
    text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600; display: none; }
  #editor-modal.readonly #editor-header .ro-badge { display: inline-block; }

  /* right-click context menu */
  #ctx-menu { position: fixed; z-index: 200; background: #0b1220; border: 1px solid #374151;
    border-radius: 4px; padding: 4px; min-width: 180px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6); display: none; }
  #ctx-menu.open { display: block; }
  #ctx-menu button { display: block; width: 100%; text-align: left; background: none;
    border: none; color: #e5e7eb; padding: 6px 10px; font-size: 12px; cursor: pointer;
    border-radius: 3px; }
  #ctx-menu button:hover { background: #1f2937; }
  #ctx-menu button:disabled { color: #4b5563; cursor: not-allowed; }
  #ctx-menu button:disabled:hover { background: none; }
  #ctx-menu .sep { height: 1px; background: #1f2937; margin: 4px 0; }
  #ctx-menu .header { font-size: 10px; color: #6b7280; padding: 4px 10px;
    text-transform: uppercase; letter-spacing: 0.6px; }
</style>

<!-- Load three as a global first; both 3d-force-graph and three-spritetext attach to it. -->
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three-spritetext@1.8.2/dist/three-spritetext.min.js"></script>
</head>
<body>

<header>
  <h1>Autobuilder · Live Goal Graph</h1>
  <span id="conn" class="pill disconnected">disconnected</span>
  <span id="cycle" class="pill">cycle —</span>
  <span id="node-count" class="pill">0 nodes</span>
  <span class="spacer"></span>
  <span class="filter-group" id="fg-status" title="Filter by status">
    status
    <select id="filter-status">
      <option value="">all</option>
      <option value="ACTIVE">ACTIVE</option>
      <option value="COMPLETED">COMPLETED</option>
      <option value="GIVEN_UP">GIVEN_UP</option>
      <option value="FULFILLED">FULFILLED</option>
    </select>
  </span>
  <span class="filter-group" id="fg-type" title="Filter by type">
    type
    <select id="filter-type">
      <option value="">all</option>
      <option value="GOAL">GOAL</option>
      <option value="SUBGOAL">SUBGOAL</option>
    </select>
  </span>
  <span class="filter-group" id="fg-role" title="Filter by role">
    role
    <select id="filter-role">
      <option value="">all</option>
    </select>
  </span>
  <label><input type="checkbox" id="toggle-orbit" checked> auto-orbit</label>
  <label><input type="checkbox" id="toggle-labels" checked> labels</label>
  <label><input type="checkbox" id="toggle-signals"> signal halo</label>
  <label title="Narrate node selections and cycle events (offline MaryTTS + reverb/delay).">
    <input type="checkbox" id="toggle-speak"> speak
  </label>
  <button id="refit">Refit</button>
  <button id="run-cycle" title="Trigger a single Autobuilder cycle now (POST /autobuilder/cycle)">Run cycle</button>
  <button id="reset-loop" title="Wipe goal graph + mutation/output folders, re-seed root goal, and start over (POST /autobuilder/reset)">Reset</button>
  <button id="resume" title="Clear SYSTEM_PAUSED + GOAL_EXHAUSTED so the scheduler picks work back up" style="display:none;">Resume loop</button>
  <a href="/goals.html" class="pill" style="text-decoration:none;" title="Static tree view (T4-AK)">list view →</a>
</header>

<div id="ctx-menu"></div>

<div id="graph"></div>

<aside id="side">
  <div class="tabs">
    <button id="tab-node" class="active" data-tab="node">Node</button>
    <button id="tab-signals" data-tab="signals">Signals</button>
    <button id="tab-inject" data-tab="inject">Inject</button>
  </div>
  <div class="panel" id="panel-node">
    <div class="empty">Click a node to view details.</div>
  </div>
  <div class="panel" id="panel-signals" style="display:none;"></div>
  <div class="panel" id="panel-inject" style="display:none;"></div>
</aside>

<div id="toast"></div>

<div id="editor-overlay" role="dialog" aria-modal="true">
  <div id="editor-modal">
    <div id="editor-header">
      <span class="editor-path" id="editor-path">—</span>
      <span class="ro-badge" title="Historical mutation snapshot — saving is disabled because the AI merge has already happened (and may have been rewritten by later cycles).">read-only</span>
      <button id="editor-save" class="primary" title="Save (Ctrl/Cmd + S)">Save</button>
      <button id="editor-revert" title="Discard unsaved changes and re-fetch the file">Revert</button>
      <button id="editor-close" title="Close (Esc)">Close</button>
    </div>
    <textarea id="editor-textarea" spellcheck="false" autocomplete="off"></textarea>
    <div id="editor-status"><span class="dot"></span><span id="editor-status-text">idle</span></div>
  </div>
</div>

<script>
// ==========================================================================================
// T4-AM: live 3D goal graph browser
// ==========================================================================================

const API = '/autobuilder/goals';
const STATUS_COLORS = {
  ACTIVE:    '#3b82f6',
  COMPLETED: '#10b981',
  GIVEN_UP:  '#ef4444',
  FULFILLED: '#f59e0b',
  UNKNOWN:   '#6b7280'
};
const CURRENT_COLOR  = '#f9fafb';
const EDGE_COLOR     = 'rgba(148, 163, 184, 0.35)';
const EDGE_CURRENT   = 'rgba(249, 250, 251, 0.8)';

// ------ state ------
const state = {
  nodesById: new Map(),          // id -> node object (position preserved across updates)
  links: [],
  currentSubGoalId: null,
  currentGoalId: null,
  signals: {},                   // SignalType name -> strength
  cycleName: null,
  cycleResultState: null,
  selectedId: null,
  hoveredId: null,
  nodeDetail: null,              // detail payload for selectedId
  showLabels: true,
  signalHalo: false,
  autoOrbit: true,
  filters: { status: '', type: '', role: '' },
  roles: new Set(),              // distinct roles populated from the graph
  focusSubtreeRoot: null,        // if set, filter collapses to that node + descendants
};

// ------ 3D graph ------
const container = document.getElementById('graph');
const Graph = ForceGraph3D()(container)
  .backgroundColor('rgba(0,0,0,0)')
  .nodeLabel(n => state.showLabels ? labelFor(n) : '')
  .nodeRelSize(5)
  .nodeOpacity(0.95)
  .nodeColor(nodeColor)
  .nodeVal(nodeSize)
  .nodeThreeObject(buildNodeSprite)
  .nodeThreeObjectExtend(true)
  .linkColor(linkColor)
  .linkWidth(l => (isLinkHotlit(l) ? 2 : (l.current ? 2 : 1)))
  .linkOpacity(l => linkVisible(l) ? 0.65 : 0.08)
  .linkDirectionalParticles(l => l.current ? 3 : 0)
  .linkDirectionalParticleSpeed(0.008)
  .linkDirectionalParticleWidth(2)
  .onNodeClick(n => { selectNode(n.id); Graph.centerAt(n.x, n.y, 600); Graph.cameraPosition({ z: 260 }, n, 800); })
  .onNodeHover(n => {
    const newId = n ? n.id : null;
    if (newId === state.hoveredId) return;
    state.hoveredId = newId;
    container.style.cursor = n ? 'pointer' : '';
    refreshLinkColors();
  })
  .onNodeRightClick((n, event) => {
    if (event && event.preventDefault) event.preventDefault();
    openContextMenu(n, event);
  })
  .onBackgroundClick(() => {
    closeContextMenu();
    if (state.selectedId) { state.selectedId = null; refreshPanels(); refreshLinkColors(); }
  })
  .onBackgroundRightClick((event) => {
    if (event && event.preventDefault) event.preventDefault();
    closeContextMenu();
  });

function buildNodeSprite(n) {
  if (!state.showLabels) return null;
  // SpriteText is provided by the three-spritetext CDN script (global).
  if (typeof SpriteText === 'undefined') {
    if (!window.__spritetextWarned) {
      console.warn('three-spritetext failed to load; graph labels disabled');
      window.__spritetextWarned = true;
    }
    return null;
  }
  const text = cropDesc(n.description || n.id, 40);
  const sprite = new SpriteText(text);
  sprite.color = n.id === state.currentSubGoalId ? '#fef3c7' : '#e5e7eb';
  sprite.textHeight = 4.5;
  sprite.backgroundColor = 'rgba(5, 7, 13, 0.8)';
  sprite.padding = 2;
  sprite.borderRadius = 2;
  sprite.material.depthWrite = false;
  // Float the label above the sphere: sphere radius ≈ nodeRelSize (5) * cbrt(nodeVal).
  const r = 5 * Math.cbrt(Math.max(1, nodeSize(n)));
  sprite.position.set(0, r + 3, 0);
  return sprite;
}

function linkColor(l) {
  const sid = typeof l.source === 'object' ? l.source.id : l.source;
  const tid = typeof l.target === 'object' ? l.target.id : l.target;
  if (state.selectedId && (sid === state.selectedId || tid === state.selectedId)) return '#fbbf24';
  if (state.hoveredId && (sid === state.hoveredId || tid === state.hoveredId)) return '#60a5fa';
  return l.current ? EDGE_CURRENT : EDGE_COLOR;
}
function isLinkHotlit(l) {
  const sid = typeof l.source === 'object' ? l.source.id : l.source;
  const tid = typeof l.target === 'object' ? l.target.id : l.target;
  return (state.hoveredId && (sid === state.hoveredId || tid === state.hoveredId))
      || (state.selectedId && (sid === state.selectedId || tid === state.selectedId));
}
function linkVisible(l) {
  const sid = typeof l.source === 'object' ? l.source.id : l.source;
  const tid = typeof l.target === 'object' ? l.target.id : l.target;
  const s = state.nodesById.get(sid);
  const t = state.nodesById.get(tid);
  return nodePasses(s) && nodePasses(t);
}

function cropDesc(s, n) {
  if (!s) return '';
  s = String(s).replace(/\s+/g, ' ').trim();
  return s.length > n ? s.substring(0, n - 1) + '…' : s;
}

Graph.d3Force('charge').strength(-180);

// Suppress the browser's default context menu over the 3D canvas so our custom menu wins.
container.addEventListener('contextmenu', e => e.preventDefault());

function nodeColor(n) {
  const base = n.id === state.currentSubGoalId
    ? CURRENT_COLOR
    : (STATUS_COLORS[n.status] || STATUS_COLORS.UNKNOWN);
  // Dim filtered-out nodes.
  if (!nodePasses(n)) return fadeColor(base, 0.2);
  return base;
}
function nodeSize(n) {
  let s = 2;
  if (n.type === 'GOAL') s = 14;
  else s += Math.min(12, (n.mergeCount || 0) * 2);
  if (n.id === state.currentSubGoalId) s *= 1.3;
  if (state.signalHalo) {
    const haloBoost = computeHalo(n);
    s += haloBoost;
  }
  return s;
}

// ------ filtering ------
function nodePasses(n) {
  if (!n) return false;
  const f = state.filters;
  if (f.status && n.status !== f.status) return false;
  if (f.type && n.type !== f.type) return false;
  if (f.role && (n.role || '') !== f.role) return false;
  if (state.focusSubtreeRoot) {
    const allowed = descendantsOf(state.focusSubtreeRoot);
    if (!allowed.has(n.id)) return false;
  }
  return true;
}
function descendantsOf(rootId) {
  const out = new Set();
  if (!rootId || !state.nodesById.has(rootId)) return out;
  const stack = [rootId];
  const childrenByParent = new Map();
  for (const m of state.nodesById.values()) {
    if (m.parentId) {
      if (!childrenByParent.has(m.parentId)) childrenByParent.set(m.parentId, []);
      childrenByParent.get(m.parentId).push(m.id);
    }
  }
  while (stack.length) {
    const id = stack.pop();
    if (out.has(id)) continue;
    out.add(id);
    const kids = childrenByParent.get(id) || [];
    for (const k of kids) stack.push(k);
  }
  return out;
}
function fadeColor(hex, alpha) {
  // Accepts '#rrggbb' or 'rgba(...)'. Returns rgba with the given alpha.
  if (!hex) return 'rgba(107,114,128,' + alpha + ')';
  if (hex.startsWith('rgb')) return hex.replace(/[\d.]+\)$/, alpha + ')');
  const m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
  if (!m) return hex;
  const r = parseInt(m[1], 16), g = parseInt(m[2], 16), b = parseInt(m[3], 16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function countVisibleNodes() {
  let n = 0;
  for (const m of state.nodesById.values()) if (nodePasses(m)) n++;
  return n;
}
function rebuildRolesFromNodes() {
  const seen = new Set();
  for (const m of state.nodesById.values()) if (m.role) seen.add(m.role);
  const changed = seen.size !== state.roles.size || [...seen].some(r => !state.roles.has(r));
  state.roles = seen;
  if (changed) rebuildRoleSelect();
}
function rebuildRoleSelect() {
  const sel = document.getElementById('filter-role');
  const current = sel.value;
  const keep = new Set([''].concat([...state.roles]));
  // Remove stale options, add new ones.
  [...sel.options].forEach(o => { if (!keep.has(o.value)) sel.removeChild(o); });
  for (const role of [...state.roles].sort()) {
    if (![...sel.options].some(o => o.value === role)) {
      const opt = document.createElement('option');
      opt.value = role; opt.textContent = role;
      sel.appendChild(opt);
    }
  }
  sel.value = [...sel.options].some(o => o.value === current) ? current : '';
}
function onFilterChange() {
  state.filters.status = document.getElementById('filter-status').value;
  state.filters.type   = document.getElementById('filter-type').value;
  state.filters.role   = document.getElementById('filter-role').value;
  applyFilterHeaderStyles();
  updateNodeCountPill();
  // Trigger re-render by re-wiring the accessors (3d-force-graph caches otherwise).
  Graph.nodeColor(Graph.nodeColor());
  Graph.linkColor(Graph.linkColor());
  Graph.linkOpacity(Graph.linkOpacity());
}
function applyFilterHeaderStyles() {
  document.getElementById('fg-status').classList.toggle('active', !!state.filters.status);
  document.getElementById('fg-type').classList.toggle('active', !!state.filters.type);
  document.getElementById('fg-role').classList.toggle('active', !!state.filters.role);
}
function updateNodeCountPill() {
  const total = state.nodesById.size;
  const visible = countVisibleNodes();
  const label = (visible === total) ? (total + ' nodes') : (visible + '/' + total + ' nodes');
  const pill = document.getElementById('node-count');
  pill.textContent = label + (state.focusSubtreeRoot ? ' · focused' : '');
}
function computeHalo(n) {
  // Signal "halo" interprets ROLE_* signals as a boost on the current subgoal
  // (since that's where the corresponding agent acts) and goal-level signals as a
  // boost on the root goal.
  if (!state.signalHalo) return 0;
  let boost = 0;
  if (n.id === state.currentSubGoalId) {
    const roleSignals = ['ROLE_EVOLUTION','ROLE_EVALUATION','ROLE_MERGE','ROLE_PLANNER','ROLE_ANALYSIS',
                         'EVOLUTION_OCCURRED','REPETITION_DETECTED','SCORE_PLATEAU','LOW_CONFIDENCE','STAGNATION'];
    for (const s of roleSignals) boost += (state.signals[s] || 0) * 0.9;
  }
  if (n.type === 'GOAL') {
    const rootSignals = ['REPLAN_REQUESTED','REPLAN_THRASH_DETECTED','GOAL_EXHAUSTED','SYSTEM_PAUSED','POTENTIALLY_COMPLETE'];
    for (const s of rootSignals) boost += (state.signals[s] || 0) * 1.2;
  }
  return Math.min(10, boost);
}
function labelFor(n) {
  const desc = n.description || n.id;
  const statusBadge = n.status ? ` [${n.status}]` : '';
  const merge = (n.mergeCount || 0) > 0 ? ` · ${n.mergeCount}✓` : '';
  const crit = (n.criteriaCount || 0) > 0 ? ` · ${n.criteriaMetCount}/${n.criteriaCount}` : '';
  return `${desc}${statusBadge}${merge}${crit}`;
}

// ------ build graph data from flat snapshots ------
function mergeSnapshot(goals) {
  // Preserve existing node objects (so positions / velocities survive).
  const incoming = new Set();
  for (const g of goals) {
    incoming.add(g.id);
    let node = state.nodesById.get(g.id);
    if (!node) {
      node = { id: g.id };
      state.nodesById.set(g.id, node);
    }
    Object.assign(node, {
      parentId: g.parentId,
      description: g.description,
      type: g.type,
      status: g.status,
      role: g.role,
      mergeCount: g.mergeCount,
      cumulativeStagnatingCycles: g.cumulativeStagnatingCycles,
      planningRunId: g.planningRunId,
      criteriaCount: g.criteriaCount,
      criteriaMetCount: g.criteriaMetCount,
      isCurrent: g.isCurrent
    });
  }
  // Drop nodes no longer present (goal was pruned).
  for (const id of Array.from(state.nodesById.keys())) {
    if (!incoming.has(id)) state.nodesById.delete(id);
  }
  // Rebuild links from parentId.
  state.links = [];
  for (const n of state.nodesById.values()) {
    if (n.parentId && state.nodesById.has(n.parentId)) {
      state.links.push({
        source: n.parentId,
        target: n.id,
        current: n.id === state.currentSubGoalId || n.parentId === state.currentSubGoalId
      });
    }
  }
  Graph.graphData({ nodes: Array.from(state.nodesById.values()), links: state.links });
  // Sphere color (status) refreshes via refreshLinkColors() re-evaluating nodeColor.
  // Text sprites are cached per node; update them in place so label color / position
  // follow status + current-subgoal changes without forcing a full factory rebuild
  // (which kills the extended sphere's color).
  for (const n of state.nodesById.values()) restyleSprite(n);
  rebuildRolesFromNodes();
  updateNodeCountPill();
}

function restyleSprite(n) {
  const obj = n && n.__threeObj;
  if (!obj || !obj.children) return;
  for (const child of obj.children) {
    if (!child || !child.isSprite) continue;
    const txt = cropDesc(n.description || n.id, 40);
    if (child.text !== txt) child.text = txt;
    child.color = n.id === state.currentSubGoalId ? '#fef3c7' : '#e5e7eb';
    const r = 5 * Math.cbrt(Math.max(1, nodeSize(n)));
    child.position.set(0, r + 3, 0);
  }
}

function refreshLinkColors() {
  // Triggers a re-evaluation without resetting positions.
  Graph.linkColor(Graph.linkColor());
  Graph.linkOpacity(Graph.linkOpacity());
  Graph.nodeColor(Graph.nodeColor());
  Graph.nodeVal(Graph.nodeVal());
}

// ------ narration (TTS) ------
// Backend-driven TTS: fetches WAV from /tts/synthesize (MaryTTS, offline) and plays it
// through a Web Audio graph that applies a reverb + delay + low-pass chain. MaryTTS raw
// voices sound dated; the effects chain is load-bearing for making it pleasant.
const TTS = (function () {
  const AudioCtx = typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext);
  const supported = typeof window !== 'undefined' && !!AudioCtx && typeof fetch === 'function';
  let enabled = false;
  let lastSpoken = '';
  let lastSpokenAt = 0;
  let lastCycleResult = null;

  let ctx = null;
  let effects = null;       // { input, master } — lazily built on first play
  let currentSource = null; // last BufferSourceNode (to cancel)
  let playing = false;
  const pending = new Map(); // text -> AbortController, so cancel() aborts inflight fetches

  function ensureCtx() {
    if (!ctx) ctx = new AudioCtx();
    // Autoplay policy: context may start suspended until a user gesture.
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    if (!effects) effects = buildEffectsGraph(ctx);
    return ctx;
  }

  // Synthesises a short decaying-noise impulse response for the ConvolverNode.
  // Avoids shipping a separate IR file; quality is fine for ambient narration reverb.
  function makeImpulse(ctx, seconds, decay) {
    const rate = ctx.sampleRate;
    const len = Math.max(1, Math.floor(rate * seconds));
    const buf = ctx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const data = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  }

  // Graph:  input → dry ─────────────────────→ master → destination
  //              ↳ convolver → reverbWet ─────↗
  // Subtle small-room reverb on top of an otherwise dry signal — Piper's voices don't
  // need masking, so we just give them a touch of spatial depth.
  function buildEffectsGraph(ctx) {
    const input = ctx.createGain();           input.gain.value = 1.0;
    const dry = ctx.createGain();             dry.gain.value = 0.92;

    const convolver = ctx.createConvolver();
    convolver.buffer = makeImpulse(ctx, 0.7, 3.5);
    const reverbWet = ctx.createGain();       reverbWet.gain.value = 0.12;

    const master = ctx.createGain();          master.gain.value = 0.95;

    input.connect(dry).connect(master);
    input.connect(convolver).connect(reverbWet).connect(master);
    master.connect(ctx.destination);

    return { input, master };
  }

  function setEnabled(v) {
    enabled = !!v;
    try { localStorage.setItem('autobuilder.tts.enabled', enabled ? '1' : '0'); } catch (e) {}
    if (!enabled) cancel();
  }
  function restore() {
    try { return localStorage.getItem('autobuilder.tts.enabled') === '1'; } catch (e) { return false; }
  }
  function cancel() {
    pending.forEach(ac => { try { ac.abort(); } catch (e) {} });
    pending.clear();
    if (currentSource) {
      try { currentSource.stop(0); } catch (e) {}
      currentSource = null;
    }
    playing = false;
  }

  async function fetchAndDecode(text, signal) {
    const url = '/tts/synthesize?text=' + encodeURIComponent(text);
    const res = await fetch(url, { signal });
    if (!res.ok) throw new Error('TTS HTTP ' + res.status);
    const bytes = await res.arrayBuffer();
    return await ctx.decodeAudioData(bytes);
  }

  function speak(text, opts) {
    if (!enabled || !supported || !text) return;
    const clean = String(text).replace(/\s+/g, ' ').trim();
    if (!clean) return;

    const now = Date.now();
    if (clean === lastSpoken && (now - lastSpokenAt) < 2000) return;
    lastSpoken = clean; lastSpokenAt = now;

    const o = opts || {};
    if (o.priority === 'high') cancel();
    if (o.priority === 'low' && playing) return;

    ensureCtx();

    const ac = new AbortController();
    pending.set(clean, ac);

    fetchAndDecode(clean, ac.signal).then(buffer => {
      if (!enabled) return;                   // toggled off while fetching
      if (o.priority === 'high') {
        if (currentSource) { try { currentSource.stop(0); } catch (e) {} }
      } else if (playing) {
        return;                                // low-priority: drop if something started meanwhile
      }
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      src.playbackRate.value = o.rate != null ? o.rate : 1.0;
      src.connect(effects.input);
      src.onended = () => { if (currentSource === src) { currentSource = null; playing = false; } };
      currentSource = src;
      playing = true;
      src.start(0);
    }).catch(err => {
      if (err && err.name === 'AbortError') return;
      console.warn('TTS fetch/decode failed', err);
    }).finally(() => {
      pending.delete(clean);
    });
  }
  function announceCycle(payload) {
    if (!payload || !payload.cycleResultState) return;
    const key = payload.cycleName + '|' + payload.cycleResultState + '|' + (payload.merged ? '1' : '0');
    if (key === lastCycleResult) return;
    lastCycleResult = key;
    // Compact phrasing, avoid reading out long hash-like cycle IDs.
    const result = payload.cycleResultState.replace(/_/g, ' ').toLowerCase();
    const verb = payload.merged ? 'merged' : 'no merge';
    speak(`Cycle ${verb}, ${result}.`, { priority: 'low' });
  }
  function announceSubgoalSwitch(newDescription) {
    if (!newDescription) return;
    speak('Now working on: ' + cropForSpeech(newDescription), { priority: 'low' });
  }
  function announceNode(detail) {
    if (!detail) return;
    const status = (detail.status || '').toLowerCase();
    const statusWord = status ? status.replace(/_/g, ' ') + '. ' : '';
    speak(statusWord + cropForSpeech(detail.description || detail.id), { priority: 'high' });
  }
  function cropForSpeech(s) {
    const clean = String(s).replace(/\s+/g, ' ').trim();
    // Cap at ~240 chars and cut on a sentence/clause boundary if possible.
    if (clean.length <= 240) return clean;
    const cut = clean.substring(0, 240);
    const lastBreak = Math.max(cut.lastIndexOf('. '), cut.lastIndexOf(', '), cut.lastIndexOf('; '));
    return (lastBreak > 120 ? cut.substring(0, lastBreak + 1) : cut) + '…';
  }
  return {
    supported, setEnabled, restore, cancel, speak,
    announceCycle, announceSubgoalSwitch, announceNode,
    isEnabled: () => enabled,
  };
})();

// Stop narration when the tab loses focus — avoids voice leaking past a tab switch.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) TTS.cancel();
});

// ------ connection ------
let es = null;
function connect() {
  if (es) { try { es.close(); } catch (e) {} }
  setConn('connecting');
  es = new EventSource(API + '/stream');
  es.onopen = () => setConn('live');
  es.onerror = () => { setConn('disconnected'); /* EventSource auto-reconnects */ };
  es.addEventListener('hello', e => handleEvent(JSON.parse(e.data)));
  es.addEventListener('cycle-end', e => handleEvent(JSON.parse(e.data)));
  es.addEventListener('tree-changed', e => handleEvent(JSON.parse(e.data)));
}
function setConn(s) {
  const el = document.getElementById('conn');
  el.className = 'pill ' + s;
  el.textContent = s;
}
function handleEvent(payload) {
  if (payload.cycleName) state.cycleName = payload.cycleName;
  if (payload.cycleResultState) state.cycleResultState = payload.cycleResultState;
  state.currentGoalId = payload.currentGoalId || state.currentGoalId;

  const prevSubGoalId = state.currentSubGoalId;
  state.currentSubGoalId = payload.currentSubGoalId || null;
  state.signals = payload.signals || {};
  if (payload.goals) mergeSnapshot(payload.goals);
  updateCyclePill(payload);
  refreshLinkColors();
  refreshPanels();

  // Side panel renders from cached detail fetched at selection time — re-fetch on SSE
  // so status/criteria/merge-count updates for the currently open node stay live.
  if (state.selectedId && state.nodesById.has(state.selectedId)) {
    refreshSelectedDetail();
  }

  // Narrate relevant transitions. `hello` is seed — we only announce deltas after it.
  if (TTS.isEnabled() && state.sseHelloSeen) {
    if (payload.cycleResultState) TTS.announceCycle(payload);
    if (state.currentSubGoalId && state.currentSubGoalId !== prevSubGoalId) {
      const n = state.nodesById.get(state.currentSubGoalId);
      if (n && n.description) TTS.announceSubgoalSwitch(n.description);
    }
  }
  if (!state.sseHelloSeen) state.sseHelloSeen = true;
}
function updateCyclePill(payload) {
  const el = document.getElementById('cycle');
  const state = payload.cycleName
    ? `cycle ${payload.cycleName}${payload.merged ? ' ✓' : ''}${payload.cycleResultState ? ' · ' + payload.cycleResultState : ''}`
    : 'cycle —';
  el.textContent = state;
  updateResumeButton();
}

function updateResumeButton() {
  // Show the Resume button whenever the loop has halted — signalled by SYSTEM_PAUSED,
  // GOAL_EXHAUSTED, or a cycleResultState of GOAL_EXHAUSTED / SYSTEM_PAUSED. This is
  // the only UI affordance for re-entering the loop after the root finishes.
  const btn = document.getElementById('resume');
  if (!btn) return;
  const s = state.signals || {};
  const halted = (s.SYSTEM_PAUSED > 0) || (s.GOAL_EXHAUSTED > 0)
      || state.cycleResultState === 'GOAL_EXHAUSTED'
      || state.cycleResultState === 'SYSTEM_PAUSED';
  btn.style.display = halted ? '' : 'none';
  btn.classList.toggle('active', halted);
}

// ------ side panels ------
function refreshPanels() {
  renderSignalPanel();
  if (state.selectedId) {
    renderNodePanel();
  } else {
    document.getElementById('panel-node').innerHTML =
      '<div class="empty">Click a node to view details.</div>';
  }
  renderInjectPanel();
}

async function selectNode(id) {
  state.selectedId = id;
  switchTab('node');
  try {
    const res = await fetch(API + '/' + encodeURIComponent(id));
    state.nodeDetail = res.ok ? await res.json() : null;
  } catch (e) {
    state.nodeDetail = null;
  }
  refreshLinkColors();
  refreshPanels();
  TTS.announceNode(state.nodeDetail);
}

async function refreshSelectedDetail() {
  const id = state.selectedId;
  if (!id) return;
  try {
    const res = await fetch(API + '/' + encodeURIComponent(id));
    if (res.ok) {
      state.nodeDetail = await res.json();
      renderNodePanel();
    }
  } catch (e) { /* transient — next SSE event will try again */ }
}

function renderNodePanel() {
  const el = document.getElementById('panel-node');
  const d = state.nodeDetail;
  if (!d) { el.innerHTML = '<div class="empty">Loading detail…</div>'; return; }

  const parts = [];
  parts.push(`<h2><span class="badge ${d.status || 'neutral'}">${d.status || '?'}</span>
    ${escapeHtml(d.description || d.id)}</h2>`);
  parts.push(`<div class="tiny">id: <code>${escapeHtml(d.id)}</code></div>`);

  parts.push('<h3>Metadata</h3>');
  parts.push('<dl class="kv">');
  parts.push(kv('Type', d.type));
  parts.push(kv('Role', d.role));
  parts.push(kv('Parent', d.parentId));
  parts.push(kv('Current', d.isCurrent ? 'yes' : 'no'));
  parts.push(kv('Merge count', d.mergeCount));
  parts.push(kv('Stagnating', d.cumulativeStagnatingCycles));
  if (d.planningRunId != null) parts.push(kv('Planning run', d.planningRunId));
  if (d.created) parts.push(kv('Created', fmtDate(d.created)));
  if (d.completed) parts.push(kv('Completed', fmtDate(d.completed)));
  if (d.givenUp) parts.push(kv('Given up', fmtDate(d.givenUp)));
  if (d.resolution) parts.push(kv('Resolution', d.resolution));
  if (d.planRationale) parts.push(kv('Plan rationale', d.planRationale));
  parts.push('</dl>');

  // Editable description
  parts.push('<h3>Description (editable)</h3>');
  parts.push(`<textarea id="desc-edit" class="desc-edit">${escapeHtml(d.description || '')}</textarea>`);
  parts.push(`<button class="small-btn" onclick="saveDescription('${escapeJs(d.id)}')">Save description</button>`);

  // Criteria table
  if (d.criteria && d.criteria.length) {
    parts.push('<h3>Criteria</h3>');
    parts.push('<table class="crit"><thead><tr><th>#</th><th>Text</th><th class="center">✓</th><th class="center">fail streak</th><th></th></tr></thead><tbody>');
    for (const c of d.criteria) {
      const pass = c.cumulativePassed;
      parts.push('<tr>');
      parts.push(`<td>${c.index}</td>`);
      parts.push(`<td>${escapeHtml(c.text || '')}</td>`);
      parts.push(`<td class="center">${pass ? '<span class="pass">✓</span>' : '<span class="muted">–</span>'}</td>`);
      parts.push(`<td class="center">${c.consecutiveFailCount || 0}</td>`);
      parts.push(`<td>${pass ? '' : `<button class="small-btn green" onclick="markCriterionMet('${escapeJs(d.id)}',${c.index})">mark met</button>`}</td>`);
      parts.push('</tr>');
    }
    parts.push('</tbody></table>');
  }

  // Merged files — open in the in-browser editor.
  if (d.mergedFiles && d.mergedFiles.length) {
    parts.push('<h3>Merged files</h3><div>');
    for (const f of d.mergedFiles) {
      parts.push(`<span class="chip" title="${escapeHtml(f)} — click to open in editor"
        onclick="openEditorByName('${escapeJs(f)}')" style="cursor:pointer;">${escapeHtml(f)}</span>`);
    }
    parts.push('</div>');
  }

  // Per-goal mutation cycles + their files. Replaces the old global mutations folder dump
  // since the user wants each goal to surface only the cycles that actually targeted it.
  parts.push('<h3>Cycles</h3>');
  parts.push(`<div id="cycles-block-${escapeJs(d.id)}"><div class="tiny">Loading cycles…</div></div>`);

  // Ancestry
  if (d.ancestry && d.ancestry.length) {
    parts.push('<h3>Ancestry</h3><div class="tiny">');
    parts.push(d.ancestry.map(a =>
      `<span class="chip" onclick="selectNode('${escapeJs(a)}')" style="cursor:pointer;">${escapeHtml(a)}</span>`
    ).join(' → '));
    parts.push('</div>');
  }

  // Actions
  parts.push('<h3>Actions</h3>');
  parts.push('<div class="actions">');
  const canPin = d.type === 'SUBGOAL' && d.status === 'ACTIVE';
  const canGiveUp = d.status !== 'GIVEN_UP';
  const isTerminal = d.status === 'GIVEN_UP' || d.status === 'COMPLETED';
  parts.push(`<button class="primary" ${canPin ? '' : 'disabled'} onclick="pinAsPriority('${escapeJs(d.id)}')">Pin as priority</button>`);
  parts.push(`<button class="danger" ${canGiveUp ? '' : 'disabled'} onclick="forceGivenUp('${escapeJs(d.id)}')">Force GIVEN_UP</button>`);
  parts.push(`<button class="primary" ${isTerminal ? '' : 'disabled'} title="${isTerminal ? 'Flip back to ACTIVE and cascade up terminal ancestors' : 'Only enabled for COMPLETED or GIVEN_UP goals'}" onclick="reactivateGoal('${escapeJs(d.id)}',${d.type === 'SUBGOAL'})">Reactivate</button>`);
  parts.push(`<button onclick="switchTab('inject')">Inject child…</button>`);
  parts.push(`<button onclick="loadSynergies('${escapeJs(d.id)}')">Show synergies</button>`);
  parts.push('</div>');

  parts.push('<div id="synergies"></div>');

  el.innerHTML = parts.join('');

  // Async hydrate per-goal cycle list once the panel is in the DOM.
  loadCyclesForGoal(d.id);
}

async function loadCyclesForGoal(goalId) {
  const target = document.getElementById('cycles-block-' + goalId);
  if (!target) return;
  try {
    const res = await fetch(API + '/' + encodeURIComponent(goalId) + '/cycles');
    const list = res.ok ? await res.json() : [];
    if (!list.length) {
      target.innerHTML = '<div class="tiny">No cycles have targeted this goal yet.</div>';
      return;
    }
    const parts = [];
    for (const c of list) {
      const ts = c.timestamp ? new Date(c.timestamp).toLocaleString() : '';
      parts.push(`<details class="cycle">
        <summary>
          <span class="merged-pill ${c.merged ? '' : 'no'}">${c.merged ? 'merged' : 'pending'}</span>
          <span style="flex:1; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(c.cycleName)}</span>
          <span class="tiny">${escapeHtml(ts)}</span>
        </summary>
        <div class="cycle-files">`);
      const files = Array.isArray(c.files) ? c.files : [];
      if (!files.length) {
        parts.push('<div class="tiny">(no files recorded)</div>');
      } else {
        for (const f of files) {
          const livePath     = 'output/' + f;
          const proposedPath = 'mutations/' + c.cycleName + '/' + f;
          parts.push(`<div class="file-row">
            <span class="file-name" title="Open the live file in output/ — edits land here and the next cycle reads them"
                  onclick="openEditor('${escapeJs(livePath)}')">${escapeHtml(f)}</span>
            <a class="tiny" href="javascript:void(0)" style="margin-left:6px;"
               title="View this cycle's historical proposal (read-only — the AI merge already happened, later cycles may have rewritten it)"
               onclick="openProposedReadOnly('${escapeJs(proposedPath)}')">view proposed</a>
          </div>`);
        }
      }
      parts.push('</div></details>');
    }
    target.innerHTML = parts.join('');
  } catch (e) {
    target.innerHTML = `<div class="tiny">Failed to load cycles: ${escapeHtml(e.message)}</div>`;
  }
}


function renderSignalPanel() {

  parts.push('<div class="legend">');
  parts.push(`<span><span class="legend-dot" style="background:${STATUS_COLORS.ACTIVE}"></span> ACTIVE</span>`);
  parts.push(`<span><span class="legend-dot" style="background:${STATUS_COLORS.COMPLETED}"></span> COMPLETED</span>`);
  parts.push(`<span><span class="legend-dot" style="background:${STATUS_COLORS.FULFILLED}"></span> FULFILLED</span>`);
  parts.push(`<span><span class="legend-dot" style="background:${STATUS_COLORS.GIVEN_UP}"></span> GIVEN_UP</span>`);

async function postJSON(method, path, body) {
  try {
    const res = await fetch(API + path, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined
    });
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) { data = { ok: false, message: text }; }
    if (!res.ok && data && data.ok === undefined) data.ok = false;
    return data;
  } catch (e) {
    return { ok: false, message: e.message };
  }
}

// ------ in-browser editor ------
// File paths are relative to file.base-path on the server (the project root). Backed by the
// existing /files/read and /files/write endpoints which run paths through resolveSecurePath
// so we can't escape the root.
//
// Editing semantics: the editor only ever writes to the LIVE project files under output/.
// Mutation snapshots under mutations/cycle-XYZ/ are opened in read-only mode because they
// are historical AI-merge inputs — the merge has already happened, later cycles may have
// rewritten them, and writing back would not propagate to the live tree.
const editor = (function () {
  const overlay = document.getElementById('editor-overlay');
  const modal   = document.getElementById('editor-modal');
  const ta      = document.getElementById('editor-textarea');
  const pathEl  = document.getElementById('editor-path');
  const status  = document.getElementById('editor-status');
  const stxt    = document.getElementById('editor-status-text');
  let currentPath = null;
  let originalContent = '';
  let readOnly = false;

  function setStatus(kind, msg) {
    status.className = kind || '';
    stxt.textContent = msg || '';
  }
  function isDirty() { return !readOnly && ta.value !== originalContent; }
  function refreshDirty() {
    if (readOnly) return;
    setStatus(isDirty() ? 'dirty' : 'saved', isDirty() ? 'unsaved changes' : 'saved');
  }

  async function open(relPath, opts) {
    const o = opts || {};
    readOnly = !!o.readOnly;
    currentPath = relPath;
    pathEl.textContent = relPath;
    ta.value = '';
    ta.readOnly = readOnly;
    modal.classList.toggle('readonly', readOnly);
    setStatus('', 'loading…');
    overlay.classList.add('open');
    try {
      const res = await fetch('/files/read?path=' + encodeURIComponent(relPath));
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      ta.value = text;
      originalContent = text;
      const suffix = readOnly ? ' · read-only (historical mutation snapshot)' : '';
      setStatus('saved', 'loaded · ' + text.length + ' chars' + suffix);
      ta.focus();
    } catch (e) {
      setStatus('error', 'load failed: ' + e.message);
    }
  }

  async function save() {
    if (!currentPath || readOnly) return;
    setStatus('', 'saving…');
    try {
      const res = await fetch('/files/write?path=' + encodeURIComponent(currentPath), {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: ta.value
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      originalContent = ta.value;
      setStatus('saved', 'saved · ' + ta.value.length + ' chars');
      toast('Saved ' + currentPath, 'ok');
    } catch (e) {
      setStatus('error', 'save failed: ' + e.message);
      toast('Save failed: ' + e.message, 'error');
    }
  }

  function close() {
    if (isDirty() && !confirm('Discard unsaved changes?')) return;
    overlay.classList.remove('open');
    modal.classList.remove('readonly');
    currentPath = null;
    originalContent = '';
    readOnly = false;
    ta.value = '';
    ta.readOnly = false;
  }
  async function revert() {
    if (!currentPath || readOnly) return;
    if (isDirty() && !confirm('Discard unsaved changes and re-fetch?')) return;
    await open(currentPath);
  }

  document.getElementById('editor-save').onclick = save;
  document.getElementById('editor-close').onclick = close;
  document.getElementById('editor-revert').onclick = revert;
  ta.addEventListener('input', refreshDirty);
  ta.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && overlay.classList.contains('open')) close();
  });
  // Click on the dimmed area (not the modal itself) to close.
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

  return { open, save, close };
})();

/** Open a live, editable file under output/ (or any other writable path). */
function openEditor(relPath) { editor.open(relPath); }

/** Open a historical mutation snapshot in read-only mode for inspection. */
function openProposedReadOnly(relPath) { editor.open(relPath, { readOnly: true }); }

// Merged-files chips carry only the basename. Try to recover the full relative path from
// the goal's cycle list (so subfolders are preserved), then open the LIVE output copy. The
// historical mutation copy is intentionally not opened here — it's archaeology, see the
// per-cycle "view proposed" link for that.
function openEditorByName(name) {
  const detail = state.nodeDetail;
  if (detail && detail.id) {
    fetch(API + '/' + encodeURIComponent(detail.id) + '/cycles').then(r => r.ok ? r.json() : []).then(list => {
      for (const c of list) {
        for (const f of (c.files || [])) {
          if (f === name || f.endsWith('/' + name)) {
            return editor.open('output/' + f);
          }
        }
      }
      editor.open('output/' + name);
    }).catch(() => editor.open('output/' + name));
  } else {
    editor.open('output/' + name);
  }
}

// ------ auto-orbit camera ------
// Pauses briefly after any pointer/wheel interaction and reads the live camera
// position each tick, so user zoom (wheel) and manual rotation (drag) are preserved
// instead of being snapped back to a fixed distance.
let orbitTimer = null;
let lastUserInteractionAt = 0;
const ORBIT_PAUSE_MS = 4000;

function noteUserInteraction() { lastUserInteractionAt = Date.now(); }
container.addEventListener('wheel',      noteUserInteraction, { passive: true });
container.addEventListener('mousedown',  noteUserInteraction);
container.addEventListener('touchstart', noteUserInteraction, { passive: true });

function startOrbit() {
  if (orbitTimer) return;
  orbitTimer = setInterval(() => {
    if (!state.autoOrbit) return;
    if (Date.now() - lastUserInteractionAt < ORBIT_PAUSE_MS) return;
    const pos = Graph.cameraPosition();
    const dist = Math.sqrt(pos.x * pos.x + pos.z * pos.z) || 420;
    const curAngle = Math.atan2(pos.x, pos.z);
    const nextAngle = curAngle + 0.003;
    Graph.cameraPosition({
      x: dist * Math.sin(nextAngle),
      z: dist * Math.cos(nextAngle)
    });
  }, 40);
}
function stopOrbit() {
  if (orbitTimer) { clearInterval(orbitTimer); orbitTimer = null; }
}

function kv(k, v) { return v != null && v !== '' ? `<dt>${k}</dt><dd>${escapeHtml(String(v))}</dd>` : ''; }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function escapeJs(s) { return String(s).replace(/['"\\]/g, '\\$&'); }
function fmtDate(iso) {
  try { return new Date(iso).toLocaleString(); } catch (e) { return iso; }
}

// ------ boot ------
async function boot() {
  try {
    const res = await fetch(API + '/tree');
    if (res.status === 200) {
      const root = await res.json();
      const flat = flattenTree(root, null);
      mergeSnapshot(flat);
      state.currentSubGoalId = findCurrent(flat);
      state.currentGoalId = root.id;
      refreshLinkColors();
    }
  } catch (e) { console.warn('seed fetch failed', e); }
  connect();
  startOrbit();
  renderInjectPanel();
  renderSignalPanel();
  refreshPanels();
  setTimeout(() => Graph.zoomToFit(600, 40), 800);
}
boot();

function flattenTree(node, parentId) {
  const out = [];
  const copy = {
    id: node.id, parentId,
    description: node.description, type: node.type, status: node.status, role: node.role,
    mergeCount: node.mergeCount || 0,
    cumulativeStagnatingCycles: node.cumulativeStagnatingCycles || 0,
    planningRunId: node.planningRunId,
    criteriaCount: node.criteriaCount || 0,
    criteriaMetCount: node.criteriaMetCount || 0,
    isCurrent: !!node.isCurrent
  };
  out.push(copy);
  for (const c of (node.subGoals || [])) out.push(...flattenTree(c, node.id));
  return out;
}
function findCurrent(flat) {
  for (const g of flat) if (g.isCurrent) return g.id;
  return null;
}
