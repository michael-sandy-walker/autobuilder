autobuilder:
  diff:
    exclude-folders:
      - logs
      - test
      - responses
    exclude-files:
      - meta.json
  evaluation:
    heuristic-threshold: 0.4
    max-score-drop: 0.2
    min-changed-files: 2
    fileContentMaxLines: 150      
  goal:
    migrate-to-graph: false
    sync-from-graph: true
    max-consecutive-subgoal-exhaustions: 5
    min-exhausted-children-floor: 5
  service:
    reset-on-start: true
  heuristic:
    score-strategy: weightedAverageScoreAdjustmentStrategy
  criteria:
    graduation-ratio: 0.80
    graduation-min-fail-streak: 3
  parser:
    source-root: src/main/java
  bootstrap:
    enabled: false
  scheduler:
    enabled: false
file:
    base-path: ${FILE_BASE_PATH:/data/firestarter}
llm:
    api:
        #url: https://api.openai.com/v1/chat/completions
        url: http://localhost:11434/v1/chat/completions
        key: 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
        #model: gpt-4o
        model: qwen3-coder:30b
        read-timeout-ms: 120000  # generous for local models; override per-environment
        retry:
            max-attempts: 3        # total attempts (1 = no retry)
            delay-ms: 5000         # wait between attempts
        #model: qwen3-30b-tuned
        #model: deepseek-coder-v2:16b
        #model: glm-4.7-flash
        #model: glm-4.7-tuned
spring:
  data:
    neo4j:
      uri: bolt://localhost:7687
      username: neo4j
      password: your_password
  jpa:
    open-in-view: false
  profiles:
    active: neo4j
server:
  port: 8081

---
# ============================================
# TEST PROFILE (NEVER RUN SCHEDULER OR BOOTSTRAP)
# ============================================
spring:
  config:
    activate:
      on-profile: test

autobuilder:
  bootstrap:
    enabled: false
  scheduler:
    enabled: false

---
# ============================================
# DEV-LOCAL PROFILE (manual cycles only)
# ============================================
spring:
  config:
    activate:
      on-profile: dev-local

autobuilder:
  bootstrap:
    enabled: true
  scheduler:
    enabled: false

---
# ============================================
# DEV-AUTO PROFILE (full autonomous loop)
# ============================================
spring:
  config:
    activate:
      on-profile: dev-auto

autobuilder:
  bootstrap:
    enabled: true
  scheduler:
    enabled: true
    inter-cycle-delay-ms: 5000