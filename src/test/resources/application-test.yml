autobuilder:
  diff:
    exclude-folders:
      - logs
      - test
      - responses
  evaluation:
    heuristic-threshold: 0.4
    max-score-drop: 0.2
    min-changed-files: 2      
  goal:
    migrate-to-graph: true
    sync-from-graph: false
  bootstrap:
    enabled: false
  scheduler:
    enabled: false
  retention:
    enabled: false
file:
    base-path: ./test-root
spring:
  data:
    neo4j:
      # T4-CL: the default test URI must NOT be the production store. Graph-touching tests
      # (the *IT classes + Neo4jGraphDbBehaviorTest) override this via @DynamicPropertySource
      # to their own Testcontainers instance; any other test context that boots the graph beans
      # gets this deliberately-dead port and fails LOUDLY (connection refused) on first query,
      # rather than silently reaching production Neo4j on 7687. The Neo4j driver connects
      # lazily, so a context that never queries the graph loads fine against this URI.
      uri: bolt://localhost:7699
      username: neo4j
      password: test-not-production
  task:
    scheduling:
      enabled: false
  config:
    activate:
      on-profile: test
# T4-EM: no narrator in tests -- it would call a model.
llm:
  narrator:
    enabled: false
