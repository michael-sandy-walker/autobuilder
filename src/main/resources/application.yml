autobuilder:
  diff:
    exclude-folders:
      - logs
      - test
      - responses
  evaluation:
    heuristic-threshold: 0.4
    max-score-drop: 0.2
    min-changed-files: 2      
  goal:
    migrate-to-graph: true
    sync-from-graph: false
  service:
    reset-on-start: true
  heuristic:
    score-strategy: weightedAverageScoreAdjustmentStrategy
  parser:
    source-root: src/main/java
  bootstrap:
    enabled: false
  scheduler:
    enabled: false
file:
    base-path: ${FILE_BASE_PATH:/data/firestarter}
openai:
    api:
        key: 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
        model: gpt-4o
spring:
  data:
    neo4j:
      uri: bolt://localhost:7687
      username: neo4j
      password: your_password
  jpa:
    open-in-view: false

---
# ============================================
# TEST PROFILE (NEVER RUN SCHEDULER OR BOOTSTRAP)
# ============================================
spring:
  config:
    activate:
      on-profile: test

autobuilder:
  bootstrap:
    enabled: false
  scheduler:
    enabled: false

---
# ============================================
# DEV-LOCAL PROFILE (manual cycles only)
# ============================================
spring:
  config:
    activate:
      on-profile: dev-local

autobuilder:
  bootstrap:
    enabled: true
  scheduler:
    enabled: false

---
# ============================================
# DEV-AUTO PROFILE (full autonomous loop)
# ============================================
spring:
  config:
    activate:
      on-profile: dev-auto

autobuilder:
  bootstrap:
    enabled: true
  scheduler:
    enabled: true